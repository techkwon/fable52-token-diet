<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광합성 · 수업 오프닝 (15초)</title>
<style>
  :root{--lime:#7CFF6B}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#02040a}
  body.idle{cursor:none}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:22px 26px 20px;display:flex;gap:14px;align-items:center;
    background:linear-gradient(transparent,rgba(0,0,0,.75));transition:opacity .45s;z-index:5}
  body.idle #ui{opacity:0;pointer-events:none}
  #ui button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.12);transition:background .2s,transform .15s}
  #ui button:hover{background:rgba(124,255,107,.3)}
  #ui button:active{transform:scale(.92)}
  #ui svg{width:22px;height:22px;fill:#fff}
  #time{font-variant-numeric:tabular-nums;font-size:15px;opacity:.85;min-width:92px}
  #seek{flex:1;accent-color:var(--lime);height:6px;cursor:pointer}
  #gate{position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:6;cursor:pointer;
    padding:13px 24px;border-radius:999px;font-size:17px;font-weight:700;letter-spacing:-.2px;
    background:rgba(10,30,18,.78);border:2px solid var(--lime);color:#eaffe5;backdrop-filter:blur(6px);
    box-shadow:0 0 0 0 rgba(124,255,107,.6);animation:pulse 1.6s infinite;display:flex;gap:10px;align-items:center}
  #gate:hover{background:rgba(40,90,40,.9)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,255,107,.55)}100%{box-shadow:0 0 0 22px rgba(124,255,107,0)}}
  #gate.hidden{display:none}
  #end{position:fixed;right:34px;bottom:96px;z-index:6;display:none}
  #end button{all:unset;cursor:pointer;padding:12px 22px;border-radius:999px;font-weight:800;font-size:17px;
    background:var(--lime);color:#06280f;box-shadow:0 8px 30px rgba(124,255,107,.35)}
  #end.show{display:block;animation:fadein .5s}
  @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #hint{position:fixed;left:26px;top:26px;font-size:13px;opacity:.55;z-index:6;transition:opacity .45s}
  body.idle #hint{opacity:0}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="gate" role="button" tabindex="0">🔊 소리 켜고 처음부터 보기</div>
<div id="hint">Space 재생/정지 · R 처음부터 · M 소리 · F 전체 화면 · ←/→ 1초 이동</div>
<div id="end"><button id="replay">↻ 다시 보기</button></div>

<div id="ui">
  <button id="play" title="재생/정지 (Space)"><svg viewBox="0 0 24 24"><path id="playIcon" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
  <button id="restart" title="처음부터 (R)"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
  <span id="time">0.0 / 15.0</span>
  <input id="seek" type="range" min="0" max="15" step="0.01" value="0" aria-label="재생 위치">
  <button id="mute" title="소리 (M)"><svg viewBox="0 0 24 24"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.6 3L19 9.6 17.6 8.2 15.2 10.6 12.8 8.2 11.4 9.6l2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg></button>
  <button id="fs" title="전체 화면 (F)"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 4v-4h2v6h-6v-2z"/></svg></button>
</div>

<script>
(()=>{
'use strict';
/* =========================================================
   광합성 수업 오프닝 · 15초 모션 그래픽 (캔버스 + Web Audio)
   전부 시간 t의 함수로 그려지므로 어느 지점으로든 이동 가능
   ?t=7.5 처럼 주소 뒤에 붙이면 그 장면에서 멈춘 채로 열림
   ========================================================= */
const W=1920,H=1080,DUR=15,TAU=Math.PI*2;
const FONT='"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let S=1;

/* ---------- math / easing ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const bump=(t,a,b,c)=>t<=a||t>=c?0:t<b?(t-a)/(b-a):1-(t-b)/(c-b);
const E={
  outCubic:x=>1-Math.pow(1-x,3),
  inCubic:x=>x*x*x,
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
  outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  outElastic:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(TAU/3))+1,
  outBounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}
};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const spriteCache={};
function glowSprite(rgb){
  if(spriteCache[rgb])return spriteCache[rgb];
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.25,`rgba(${rgb},.55)`);gr.addColorStop(.6,`rgba(${rgb},.14)`);gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=gr;g.fillRect(0,0,128,128);return spriteCache[rgb]=c;
}
function glow(x,y,r,rgb,a){if(a<=0||r<=0)return;ctx.save();ctx.globalAlpha*=Math.min(1,a);ctx.globalCompositeOperation='lighter';ctx.drawImage(glowSprite(rgb),x-r,y-r,r*2,r*2);ctx.restore();}
function shadow(col,blur){ctx.shadowColor=col;ctx.shadowBlur=blur*S;}

function charWidths(str,size,weight,ls=0){ctx.font=`${weight} ${size}px ${FONT}`;return [...str].map(c=>ctx.measureText(c).width+ls);}
/* 글자 단위 키네틱 타이포 */
function ktext(str,x,y,t,t0,o={}){
  const size=o.size||80,weight=o.weight||800,st=o.stagger??.035,dur=o.dur??.5,ls=o.ls||0;
  const chars=[...str],ws=charWidths(str,size,weight,ls);
  const total=ws.reduce((a,b)=>a+b,0)-ls;
  let cx=o.align==='left'?x:o.align==='right'?x-total:x-total/2;
  const baseA=ctx.globalAlpha;
  for(let i=0;i<chars.length;i++){
    const c=chars[i],w=ws[i],px=cx+(w-ls)/2;cx+=w;
    if(c===' ')continue;
    const p=clamp((t-t0-i*st)/dur);if(p<=0)continue;
    let dy=0,sc=1,al=1,rot=0;
    switch(o.style||'pop'){
      case'pop':sc=E.outBack(p);al=clamp(p*3);dy=(1-E.outCubic(p))*size*.35;break;
      case'rise':dy=(1-E.outExpo(p))*size*.85;al=E.outCubic(p);break;
      case'slam':sc=lerp(2.8,1,E.outExpo(p));al=clamp(p*5);break;
      case'drop':dy=-(1-E.outBounce(p))*size*1.1;al=clamp(p*4);break;
      case'fade':al=E.outCubic(p);break;
      case'spin':sc=E.outBack(p);rot=(1-E.outCubic(p))*-1.1;al=clamp(p*3);break;
    }
    if(o.out!=null){const q=clamp((t-o.out-i*(o.outStagger??.012))/(o.outDur??.25));if(q>=1)continue;al*=1-q;dy-=E.inCubic(q)*size*.5;sc*=1+q*.25;}
    ctx.save();ctx.translate(px,y+dy);if(rot)ctx.rotate(rot);if(sc!==1)ctx.scale(sc,sc);
    ctx.globalAlpha=baseA*al*(o.alpha??1);
    ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    if(o.stroke){ctx.lineJoin='round';ctx.lineWidth=o.strokeW||8;ctx.strokeStyle=o.stroke;ctx.strokeText(c,0,0);}
    if(o.glow)shadow(o.glow,o.glowBlur||30);
    ctx.fillStyle=o.colorFn?o.colorFn(i,c):(o.color||'#fff');ctx.fillText(c,0,0);
    ctx.restore();
  }
  return total;
}
function label(str,x,y,size,weight,color,align='center',a=1){
  ctx.save();ctx.globalAlpha*=a;ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(str,x,y);ctx.restore();
}

/* ---------- 분자 / 아이콘 ---------- */
const ATOM={C:['#b6bfd0','#2c3240',24],O:['#ffc9c9','#e3263a',21],H:['#ffffff','#9fb0c6',13]};
function atom(type,x,y,s){
  const [l,d,r0]=ATOM[type],r=r0*s;
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);g.addColorStop(0,l);g.addColorStop(1,d);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.lineWidth=1.5*s;ctx.strokeStyle='rgba(255,255,255,.28)';ctx.stroke();
}
function bond(x1,y1,x2,y2,s,dbl){
  ctx.strokeStyle='rgba(235,245,255,.75)';ctx.lineWidth=5*s;ctx.lineCap='round';
  if(dbl){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L*4.5*s,ny=dx/L*4.5*s;
    ctx.beginPath();ctx.moveTo(x1+nx,y1+ny);ctx.lineTo(x2+nx,y2+ny);ctx.moveTo(x1-nx,y1-ny);ctx.lineTo(x2-nx,y2-ny);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
}
function co2(x,y,s,rot,a=1){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);
  bond(-40*s,0,0,0,s,true);bond(0,0,40*s,0,s,true);
  atom('O',-40*s,0,s);atom('C',0,0,s);atom('O',40*s,0,s);ctx.restore();
}
function h2o(x,y,s,rot,a=1){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);
  const hx=Math.sin(.912)*36*s,hy=Math.cos(.912)*36*s;
  bond(0,0,-hx,hy,s);bond(0,0,hx,hy,s);
  atom('H',-hx,hy,s);atom('H',hx,hy,s);atom('O',0,0,s);ctx.restore();
}
function o2(x,y,s,rot,a=1,bubble=true){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);
  if(bubble){
    ctx.beginPath();ctx.arc(0,0,46*s,0,TAU);ctx.fillStyle='rgba(120,225,255,.10)';ctx.fill();
    ctx.lineWidth=3*s;ctx.strokeStyle='rgba(170,240,255,.6)';ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,36*s,-2.5,-1.6);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4*s;ctx.lineCap='round';ctx.stroke();
  }
  ctx.rotate(rot);bond(-19*s,0,19*s,0,s,true);atom('O',-19*s,0,s);atom('O',19*s,0,s);ctx.restore();
}
function glucose(x,y,s,rot,a=1){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);
  glow(0,0,90*s,'255,180,60',.5);
  const R=40*s;ctx.beginPath();
  for(let i=0;i<6;i++){const an=i*TAU/6-Math.PI/2;ctx[i?'lineTo':'moveTo'](Math.cos(an)*R,Math.sin(an)*R);}
  ctx.closePath();
  const g=ctx.createLinearGradient(0,-R,0,R);g.addColorStop(0,'#ffe9a3');g.addColorStop(1,'#ff9416');
  ctx.fillStyle=g;ctx.fill();ctx.lineJoin='round';ctx.lineWidth=5*s;ctx.strokeStyle='#fff3cf';ctx.stroke();
  for(let i=1;i<6;i++){const an=i*TAU/6-Math.PI/2;ctx.beginPath();ctx.arc(Math.cos(an)*R,Math.sin(an)*R,5.5*s,0,TAU);ctx.fillStyle='#4a3a20';ctx.fill();}
  atom('O',0,-R,s*.55);
  ctx.font=`900 ${22*s}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(90,45,0,.8)';ctx.fillText('당',0,3*s);
  ctx.restore();
}
function sun(x,y,r,t,a=1){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;
  glow(x,y,r*3.4,'255,190,60',.6);ctx.translate(x,y);ctx.rotate(t*.7);
  ctx.fillStyle='#ffd23f';
  for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*TAU/12);ctx.beginPath();ctx.moveTo(r*1.16,-r*.14);ctx.lineTo(r*(i%2?1.5:1.72),0);ctx.lineTo(r*1.16,r*.14);ctx.closePath();ctx.fill();ctx.restore();}
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,'#fffbe0');g.addColorStop(.5,'#ffd84a');g.addColorStop(1,'#ff9b1a');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();ctx.restore();
}
function star4(x,y,r,a,col='255,255,220'){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.fillStyle=`rgb(${col})`;
  ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(0,0,r,0);ctx.quadraticCurveTo(0,0,0,r);ctx.quadraticCurveTo(0,0,-r,0);ctx.quadraticCurveTo(0,0,0,-r);ctx.fill();
  ctx.restore();glow(x,y,r*2.2,col,a*.6);
}
function smallLeaf(x,y,sz,rot,col,a=1){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);
  ctx.beginPath();ctx.moveTo(-sz,0);ctx.quadraticCurveTo(0,-sz*.7,sz,0);ctx.quadraticCurveTo(0,sz*.7,-sz,0);ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=Math.max(1,sz*.08);ctx.beginPath();ctx.moveTo(-sz*.9,0);ctx.lineTo(sz*.8,0);ctx.stroke();ctx.restore();
}
function partialQuad(x0,y0,x1,y1,x2,y2,f){
  ctx.beginPath();ctx.moveTo(x0,y0);
  for(let k=1;k<=14;k++){const s=k/14*f,u=1-s;ctx.lineTo(u*u*x0+2*u*s*x1+s*s*x2,u*u*y0+2*u*s*y1+s*s*y2);}
  ctx.stroke();
}
/* 빛 알갱이 (광자) – 물결치는 빛줄기 */
function photon(x0,y0,x1,y1,s,len,amp,phase,a){
  if(a<=0)return;
  const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
  ctx.save();ctx.globalAlpha*=a;ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='#ffe066';ctx.lineWidth=4;ctx.lineCap='round';shadow('#ffcc00',14);
  ctx.beginPath();let first=true;
  for(let k=0;k<=28;k++){const f=s-len*(1-k/28);if(f<0||f>1)continue;const w=Math.sin(f*L/20+phase)*amp*(.3+.7*k/28);
    const px=x0+dx*f+nx*w,py=y0+dy*f+ny*w;if(first){ctx.moveTo(px,py);first=false}else ctx.lineTo(px,py);}
  ctx.stroke();ctx.restore();
  if(s>=0&&s<=1)glow(x0+dx*s,y0+dy*s,26,'255,230,120',a*.9);
}
/* 정보 칩 (왼쪽 기준) */
function chip(x,y,title,sub,col,p,a=1){
  if(p<=0||a<=0)return;
  ctx.save();ctx.translate(x,y);const sc=E.outBack(clamp(p));ctx.scale(sc,sc);ctx.globalAlpha*=clamp(p*2.5)*a;
  ctx.font=`800 46px ${FONT}`;const tw=ctx.measureText(title).width;ctx.font=`600 27px ${FONT}`;const sw=ctx.measureText(sub).width;
  const w=Math.max(tw,sw)+56,h=108;
  rr(0,-h/2,w,h,24);ctx.fillStyle='rgba(3,18,10,.74)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=col;ctx.stroke();
  rr(0,-h/2+18,7,h-36,4);ctx.fillStyle=col;ctx.fill();
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.font=`800 46px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(title,28,-15);
  ctx.font=`600 27px ${FONT}`;ctx.fillStyle=col;ctx.fillText(sub,28,29);
  ctx.restore();
}
function stepTag(n,text,pin,pout){
  if(pin<=0||pout>=1)return;
  const dx=-(1-E.outExpo(pin))*420-E.inCubic(pout)*420;
  ctx.save();ctx.globalAlpha*=clamp(pin*2)*(1-pout);ctx.translate(64+dx,78);
  ctx.font=`800 36px ${FONT}`;const tw=ctx.measureText(text).width;
  rr(0,-36,tw+200,72,36);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(160,255,140,.55)';ctx.stroke();
  ctx.beginPath();ctx.arc(36,0,26,0,TAU);ctx.fillStyle='#7CFF6B';ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#062a10';ctx.font=`900 30px ${FONT}`;ctx.fillText(n,36,2);
  ctx.textAlign='left';ctx.font=`800 22px ${FONT}`;ctx.fillStyle='#7CFF6B';ctx.fillText('STEP',76,1);
  ctx.font=`800 36px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(text,150,2);
  ctx.restore();
}

/* =========================================================
   SCENE 1 · 0.0–2.7  훅: "숨 들이쉬어 봐 → 그 산소, 누가 만들었을까?"
   ========================================================= */
const R1=rng(11);
const AIR=[...Array(170)].map((_,i)=>({a:R1()*TAU,r:260+R1()*950,s:1.2+R1()*3,o2:i<10,sp:(R1()-.5)*.7}));
const SPEED=[...Array(72)].map(()=>({a:R1()*TAU,d:R1(),w:1+R1()*3.5}));
function scene1(t){
  const g=ctx.createRadialGradient(960,540,40,960,540,1150);
  g.addColorStop(0,'#10213b');g.addColorStop(1,'#010309');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  glow(960,600,1000,'255,190,70',bump(t,1.56,1.62,2.3)*.45);

  // 숨 고리
  if(t<1.25){
    const b=E.inOutSine(P(t,0,1.1)),r=150+300*b,a=clamp(t*4)*(1-P(t,1.05,1.2));
    ctx.save();ctx.globalAlpha*=a;glow(960,540,r*1.5,'80,190,255',.22+.25*b);
    ctx.strokeStyle='rgba(150,225,255,.75)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(960,540,r,0,TAU);ctx.stroke();
    ctx.strokeStyle='rgba(150,225,255,.25)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(960,540,r*1.14,0,TAU);ctx.stroke();
    ctx.restore();
  }
  // 공기 입자: 들숨에 빨려 들어왔다가 질문과 함께 튕겨 나감
  const inh=E.inCubic(P(t,0,1.15)),ex=E.outExpo(P(t,1.15,2.4));
  ctx.save();ctx.lineCap='round';
  for(const p of AIR){
    let r,a,al;
    if(t<1.15){r=p.r*(1-.9*inh);a=p.a+inh*1.5+p.sp*t;al=clamp(t*3)*(.35+.65*inh)*clamp(r/140);}
    else{r=lerp(p.r*.1,p.r*1.6,ex);a=p.a+1.5+p.sp*t;al=(1-P(t,1.3,2.6))*.9;}
    if(al<=0)continue;

const IMPACTS=[[1.15,10],[1.58,30],[2.7,16],[3.22,14],[5.0,22],[8.55,16],[12.65,36],[12.76,14],[12.86,14]];
function shake(t){let x=0,y=0;IMPACTS.forEach(([ti,a],i)=>{const d=t-ti;if(d<0||d>.7)return;const e=a*Math.exp(-d*8);x+=e*Math.sin(d*71+i);y+=e*Math.cos(d*59+i*2);});return[x,y];}
let grainPat=null,vignette=null,frame=0;
function initOverlays(){
  const n=document.createElement('canvas');n.width=n.height=220;const g=n.getContext('2d'),id=g.createImageData(220,220);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}
  g.putImageData(id,0,0);grainPat=ctx.createPattern(n,'repeat');

}

/* =========================================================

   ========================================================= */
let actx=null,comp=null,rev=null,bus=null,noiseBuf=null,audioOn=false,audioStart=0,audioOffset=0;

  if(actx)return;
  actx=new(window.AudioContext||window.webkitAudioContext)();
  noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  comp=actx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;comp.connect(actx.destination);
  rev=actx.createConvolver();const len=actx.sampleRate*2.2,ir=actx.createBuffer(2,len,actx.sampleRate);
  for(let c=0;c<2;c++){const ch=ir.getChannelData(c);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  rev.buffer=ir;const rg=actx.createGain();rg.gain.value=.55;rev.connect(rg);rg.connect(comp);
}
function newBus(){
  killBus();bus=actx.createGain();bus.gain.value=.85;bus.connect(comp);
  const send=actx.createGain();send.gain.value=.28;bus.connect(send);send.connect(rev);
}
function killBus(){if(!bus)return;const b=bus;bus=null;try{b.gain.setTargetAtTime(0,actx.currentTime,.03);}catch(e){}setTimeout(()=>{try{b.disconnect()}catch(e){}},300);}

function env(node,T,a,peak,d){node.gain.setValueAtTime(.0001,T);node.gain.exponentialRampToValueAtTime(peak,T+a);node.gain.exponentialRampToValueAtTime(.0001,T+a+d);}

function kick(T,g=.8,f0=150,f1=45,d=.38){const o=actx.createOscillator(),v=actx.createGain();o.type='sine';o.frequency.setValueAtTime(f0,T);o.frequency.exponentialRampToValueAtTime(f1,T+.13);env(v,T,.004,g,d);o.connect(v);v.connect(out());o.start(T);o.stop(T+d+.1);}
function boom(T,g=1){const o=actx.createOscillator(),v=actx.createGain();o.frequency.setValueAtTime(110,T);o.frequency.exponentialRampToValueAtTime(28,T+1.1);env(v,T,.005,g,1.5);o.connect(v);v.connect(out());o.start(T);o.stop(T+1.7);
  const n=noise(T,.6),f=actx.createBiquadFilter(),nv=actx.createGain();f.type='lowpass';f.frequency.value=380;env(nv,T,.003,g*.5,.5);n.connect(f);f.connect(nv);nv.connect(out());kick(T,g*.7);}
function hit(T,g=.5){const n=noise(T,.25),f=actx.createBiquadFilter(),v=actx.createGain();f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;env(v,T,.002,g,.18);n.connect(f);f.connect(v);v.connect(out());
  const o=actx.createOscillator(),ov=actx.createGain();o.type='triangle';o.frequency.setValueAtTime(220,T);o.frequency.exponentialRampToValueAtTime(110,T+.08);env(ov,T,.002,g*.6,.1);o.connect(ov);ov.connect(out());o.start(T);o.stop(T+.2);}
function hat(T,g=.1){const n=noise(T,.08),f=actx.createBiquadFilter(),v=actx.createGain();f.type='highpass';f.frequency.value=7500;env(v,T,.001,g,.05);n.connect(f);f.connect(v);v.connect(out());}
function crash(T,g=.3,d=1.7){const n=noise(T,d+.1),f=actx.createBiquadFilter(),v=actx.createGain();f.type='highpass';f.frequency.value=3800;env(v,T,.003,g,d);n.connect(f);f.connect(v);v.connect(out());}
function whoosh(T,dur,g=.4,f0=300,f1=6000){const n=noise(T,dur+.2),f=actx.createBiquadFilter(),v=actx.createGain();f.type='bandpass';f.Q.value=1.1;f.frequency.setValueAtTime(f0,T);f.frequency.exponentialRampToValueAtTime(f1,T+dur);
  v.gain.setValueAtTime(0,T);v.gain.linearRampToValueAtTime(g,T+dur*.85);v.gain.linearRampToValueAtTime(0,T+dur+.1);n.connect(f);f.connect(v);v.connect(out());}

  l.type='lowpass';l.frequency.value=3200;v.gain.setValueAtTime(0,T);v.gain.linearRampToValueAtTime(.32,T+dur*.85);v.gain.linearRampToValueAtTime(0,T+dur+.12);n.connect(f);f.connect(l);l.connect(v);v.connect(out());}
function blip(T,f0,f1,g=.2,d=.14){const o=actx.createOscillator(),v=actx.createGain();o.type='sine';o.frequency.setValueAtTime(f0,T);o.frequency.exponentialRampToValueAtTime(f1,T+d*.6);env(v,T,.003,g,d);o.connect(v);v.connect(out());o.start(T);o.stop(T+d+.05);}
function bell(T,f,g=.12,d=1.2){[[1,1,1],[2.76,.4,.5],[5.4,.18,.3]].forEach(([m,gg,dd])=>{const o=actx.createOscillator(),v=actx.createGain();o.type='sine';o.frequency.value=f*m;env(v,T,.003,g*gg,d*dd);o.connect(v);v.connect(out());o.start(T);o.stop(T+d*dd+.05);});}

  f.type='lowpass';f.frequency.setValueAtTime(400,T);f.frequency.exponentialRampToValueAtTime(6000,T+dur);v.gain.setValueAtTime(0,T);v.gain.linearRampToValueAtTime(g,T+dur);v.gain.linearRampToValueAtTime(0,T+dur+.05);o.connect(f);f.connect(v);v.connect(out());o.start(T);o.stop(T+dur+.1);}

function startAudio(offset){
  if(!actx||!audioOn)return;
  if(actx.state==='suspended')actx.resume();
  newBus();
  const base=actx.currentTime+.06;audioStart=base;audioOffset=offset;
  for(const e of EV){
    if(e.dur!=null){if(e.t>=offset)e.fn(base+e.t-offset,e.dur);else if(e.t+e.dur>offset+.2)e.fn(base,e.t+e.dur-offset);}
    else if(e.t>=offset-.001)e.fn(base+e.t-offset);
  }
}

const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let T=0,playing=true,last=performance.now();
if(qs.has('t')){T=clamp(parseFloat(qs.get('t'))||0,0,DUR);playing=false;}
function resize(){
  const vw=innerWidth,vh=innerHeight;let w=vw,h=vw*9/16;if(h>vh){h=vh;w=vh*16/9;}
  cv.style.width=w+'px';cv.style.height=h+'px';
  let dpr=Math.min(window.devicePixelRatio||1,2);if(w*dpr>2560)dpr=2560/w;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);S=cv.width/W;
}
function setPlayIcon(){$('playIcon').setAttribute('d',playing?'M6 5h4v14H6zM14 5h4v14h-4z':'M7 4l13 8-13 8z');}
function setMuteIcon(){$('muteIcon').setAttribute('d',audioOn?'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z':'M3 9v6h4l5 5V4L7 9H3zm13.6 3L19 9.6 17.6 8.2 15.2 10.6 12.8 8.2 11.4 9.6l2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z');}
function play(){if(T>=DUR)T=0;playing=true;$('end').classList.remove('show');startAudio(T);setPlayIcon();}
function pause(){playing=false;killBus();setPlayIcon();}
function seek(v){T=clamp(v,0,DUR);$('end').classList.toggle('show',T>=DUR);if(playing)startAudio(T);}
function restart(){T=0;$('end').classList.remove('show');playing=true;startAudio(0);setPlayIcon();}
function enableSound(fromStart){
  initAudio();audioOn=true;setMuteIcon();$('gate').classList.add('hidden');
  if(actx.state==='suspended')actx.resume();
  if(fromStart)restart();else if(playing)startAudio(T);
}
function toggleMute(){if(audioOn){audioOn=false;killBus();setMuteIcon();}else enableSound(false);}
$('gate').addEventListener('click',()=>enableSound(true));
$('play').addEventListener('click',()=>playing?pause():play());
$('restart').addEventListener('click',restart);
$('replay').addEventListener('click',restart);
$('mute').addEventListener('click',toggleMute);
$('fs').addEventListener('click',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();});
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>b.blur()));
let scrubbing=false;
$('seek').addEventListener('input',e=>{scrubbing=true;T=parseFloat(e.target.value);killBus();});
$('seek').addEventListener('change',e=>{scrubbing=false;seek(parseFloat(e.target.value));});
cv.addEventListener('click',()=>{if(!audioOn&&!$('gate').classList.contains('hidden'))enableSound(true);else playing?pause():play();});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing?pause():play();}
  else if(e.key==='r'||e.key==='R')restart();
  else if(e.key==='m'||e.key==='M')toggleMute();
  else if(e.key==='f'||e.key==='F')$('fs').click();
  else if(e.key==='ArrowRight')seek(T+1);
  else if(e.key==='ArrowLeft')seek(T-1);
  wake();
});
let idleTimer=0;function wake(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(playing)document.body.classList.add('idle');},2200);}
addEventListener('mousemove',wake);addEventListener('touchstart',wake,{passive:true});
addEventListener('resize',resize);

function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing&&!scrubbing){
    if(audioOn&&bus&&actx&&actx.state==='running')T=Math.max(audioOffset,audioOffset+(actx.currentTime-audioStart));
    else T+=dt;
    if(T>=DUR){T=DUR;playing=false;setPlayIcon();$('end').classList.add('show');document.body.classList.remove('idle');}
  }
  render(T);
  if(!scrubbing)$('seek').value=T;
  $('time').textContent=`${T.toFixed(1)} / ${DUR.toFixed(1)}`;
  requestAnimationFrame(loop);
}
resize();initOverlays();setPlayIcon();setMuteIcon();wake();
if(T>=DUR)$('end').classList.add('show');
requestAnimationFrame(loop);
})();
