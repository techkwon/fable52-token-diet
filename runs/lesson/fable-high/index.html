<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광합성 — 수업 오프닝 (15초)</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  body{display:grid;place-items:center;
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #stage{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;background:#000;overflow:hidden}
  #stage.idle{cursor:none}
  canvas{display:block;width:100%;height:100%}

  .ui{transition:opacity .25s ease}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid #B8FF5A;outline-offset:3px}

  #bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
    padding:36px 18px 14px;color:#fff;
    background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0));
    opacity:0;pointer-events:none;cursor:default}
  #stage.show #bar,#stage.paused #bar,#bar:focus-within{opacity:1;pointer-events:auto}
  .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ib:hover{background:rgba(255,255,255,.16)}
  .ib svg{width:24px;height:24px;fill:#fff}
  #time{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.92;min-width:86px;text-align:center}
  #seek{flex:1;min-width:60px;height:24px;margin:0;background:transparent;accent-color:#B8FF5A;cursor:pointer;
    -webkit-appearance:none;appearance:none}
  #seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;
    background:linear-gradient(to right,#B8FF5A var(--p,0%),rgba(255,255,255,.3) var(--p,0%))}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5px;
    box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #seek::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
  #seek::-moz-range-progress{height:6px;border-radius:3px;background:#B8FF5A}
  #seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}

  #pill{position:absolute;top:18px;right:18px;display:flex;align-items:center;gap:8px;
    padding:10px 18px 10px 14px;border-radius:999px;font-size:15px;font-weight:700;color:#06281A;
    background:#B8FF5A;box-shadow:0 4px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;white-space:nowrap}
  #pill svg{width:20px;height:20px;fill:#06281A;flex:none}
  #stage.hint #pill,#stage.show #pill,#stage.paused #pill{opacity:1;pointer-events:auto}
  #stage.sound #pill{display:none}
  #pill:hover{background:#D4FF7A}

  #again{position:absolute;right:18px;bottom:18px;display:flex;align-items:center;gap:8px;
    padding:10px 18px 10px 14px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;
    background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.55);opacity:0;pointer-events:none;white-space:nowrap}
  #again svg{width:20px;height:20px;fill:#fff;flex:none}
  #stage.ended:not(.show) #again{opacity:1;pointer-events:auto}
  #again:hover{background:rgba(0,0,0,.8)}

  #stage.clean .ui{display:none}
  @media (max-width:520px){#time{display:none}#pill,#again{font-size:13px}}
</style>
</head>
<body>
<div id="stage" class="hint">
  <canvas id="c" width="1920" height="1080" role="img"
    aria-label="광합성 수업 오프닝 영상. 밥 안 먹고 평생 살 수 있을까? 식물은 그렇게 산다. 엽록체에서 물과 이산화 탄소가 빛에너지를 받아 포도당과 산소가 된다. 오늘의 질문: 식물은 어떻게 스스로 양분을 만들까?"></canvas>

  <button id="pill" class="ui" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <span>소리 켜고 처음부터</span>
  </button>

  <button id="again" class="ui" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    <span>다시 보기</span>
  </button>

  <div id="bar" class="ui">
    <button id="bPlay" class="ib" type="button" aria-label="일시정지">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="iPlay" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <input id="seek" type="range" min="0" max="15" step="0.01" value="0" aria-label="재생 위치">
    <span id="time">0:00 / 0:15</span>
    <button id="bSound" class="ib" type="button" aria-label="소리 켜기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="iSound" d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
    </button>
    <button id="bFull" class="ib" type="button" aria-label="전체 화면">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h6v2H7v4H5V5zm8 0h6v6h-2V7h-4V5zM5 13h2v4h4v2H5v-6zm12 0h2v6h-6v-2h4v-4z"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────────────────────── 기본 설정 ───────────────────────── */
const W = 1920, H = 1080, DUR = 15;
const FONT = '"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif';
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const fx = document.createElement('canvas');
const fxCtx = fx.getContext('2d');
let SC = 1;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  stage.style.width = cw + 'px';
  stage.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.min(2560, Math.max(640, Math.round(cw * dpr)));
  cv.width = pw; cv.height = Math.round(pw * H / W);
  fx.width = cv.width; fx.height = cv.height;
  SC = cv.width / W;
}
addEventListener('resize', resize);
resize();

/* ───────────────────────── 수학 도우미 ───────────────────────── */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  inCubic: p => p * p * p,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  outBack: (p, s = 1.9) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2)
};
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pop = (t, t0, d = .32) => t < t0 ? 0 : E.outBack(prog(t, t0, t0 + d));
function slam(t, t0, d = .24) {
  if (t < t0) return null;
  const p = prog(t, t0, t0 + d);
  const b = Math.sin(clamp((t - t0 - .1) / .3) * Math.PI) * .045;
  return { sc: 1 + (1 - E.outExpo(p)) * 1.9 - b, alpha: clamp(p * 6) };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(p))).join(',') + ')'; };
const bez = (P, f) => {
  const m = 1 - f, a = m * m * m, b = 3 * m * m * f, c = 3 * m * f * f, d = f * f * f;
  return [a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1]];
};
const qbez = (P, f) => {
  const m = 1 - f;
  return [m * m * P[0][0] + 2 * m * f * P[1][0] + f * f * P[2][0], m * m * P[0][1] + 2 * m * f * P[1][1] + f * f * P[2][1]];
};

/* ───────────────────────── 그리기 도우미 ───────────────────────── */
const mcache = new Map();
function mw(s, size, w = 900) {
  const k = w + '|' + s;
  let v = mcache.get(k);
  if (v == null) {
    mainCtx.save();
    mainCtx.font = w + ' 100px ' + FONT;
    v = mainCtx.measureText(s).width / 100;
    mainCtx.restore();
    mcache.set(k, v);
  }
  return v * size;
}
function T(s, x, y, size, o) {
  o = o || {};
  if (o.sc != null && o.sc <= .001) return;
  ctx.save();
  ctx.font = (o.w || 900) + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.sc != null) ctx.scale(o.sc, o.sc);
  if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
  ctx.lineJoin = 'round';
  if (o.depth) {
    ctx.fillStyle = o.depthColor || '#000';
    for (let k = o.depth; k >= 1; k--) ctx.fillText(s, k * o.dstep, k * o.dstep);
  }
  if (o.outline) { ctx.lineWidth = o.ow || size * .14; ctx.strokeStyle = o.outline; ctx.strokeText(s, 0, 0); }
  let fill = o.color || '#fff';
  if (o.grad) {
    const g = ctx.createLinearGradient(0, -size * .48, 0, size * .48);
    o.grad.forEach((c, i) => g.addColorStop(i / (o.grad.length - 1), c));
    fill = g;
  }
  ctx.fillStyle = fill;
  const fat = o.fat == null ? .028 : o.fat;
  if (fat) { ctx.lineWidth = size * fat; ctx.strokeStyle = fill; ctx.strokeText(s, 0, 0); }
  ctx.fillText(s, 0, 0);
  ctx.restore();
}
function withA(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= Math.min(1, a); fn(); ctx.restore(); }
function bg(c) { ctx.fillStyle = c; ctx.fillRect(-60, -60, W + 120, H + 120); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glow(x, y, r, rgb, a) {
  if (a <= 0 || r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
  g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function burst(cx, cy, n, rot, r, fill) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.fillStyle = fill;
  const a = Math.PI / n;
  for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, i * 2 * a, i * 2 * a + a); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function sun(x, y, r, rot, sc) {
  if (sc <= .001) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.save(); ctx.rotate(rot); ctx.fillStyle = '#FF9F0A';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath(); ctx.moveTo(r * 1.2, -r * .17); ctx.lineTo(r * 1.6, 0); ctx.lineTo(r * 1.2, r * .17); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  circle(0, 0, r); ctx.fillStyle = '#FF9F0A'; ctx.fill();
  circle(0, 0, r * .88); ctx.fillStyle = '#FFD21F'; ctx.fill();
  circle(-r * .12, -r * .12, r * .6); ctx.fillStyle = '#FFE86B'; ctx.fill();
  ctx.restore();
}
function leaf(x, y, ang, len, wid, sc, c1, c2, cvn) {
  if (sc <= .001) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(sc, sc);
  const path = () => {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(len * .22, -wid, len * .72, -wid * .85, len, 0);
    ctx.bezierCurveTo(len * .72, wid * .85, len * .22, wid, 0, 0);
    ctx.closePath();
  };
  path(); ctx.fillStyle = c1; ctx.fill();
  if (c2) { ctx.save(); path(); ctx.clip(); ctx.fillStyle = c2; ctx.fillRect(0, 0, len, wid); ctx.restore(); }
  if (cvn) {
    ctx.strokeStyle = cvn; ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, wid * .05);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * .93, 0); ctx.stroke();
    ctx.lineWidth = Math.max(2, wid * .03);
    for (const f of [.2, .38, .56, .74]) for (const sd of [-1, 1]) {
      const pr = Math.sin(Math.PI * Math.min(1, f + .12)) * wid * .52;
      ctx.beginPath(); ctx.moveTo(len * f, 0);
      ctx.quadraticCurveTo(len * (f + .08), sd * pr * .6, len * (f + .15), sd * pr); ctx.stroke();
    }
  }
  ctx.restore();
}
function drop(x, y, s, rot) {
  if (s <= .001) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, -32);
  ctx.bezierCurveTo(4, -14, 20, -4, 20, 10);
  ctx.arc(0, 10, 20, 0, Math.PI);
  ctx.bezierCurveTo(-20, -4, -4, -14, 0, -32);
  ctx.closePath(); ctx.fillStyle = '#45C1FF'; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.ellipse(-8, 12, 4, 8, .5, 0, TAU); ctx.fill();
  ctx.restore();
}
function ball(x, y, r, c) {
  circle(x, y, r); ctx.fillStyle = c; ctx.fill();
  circle(x - r * .3, y - r * .32, r * .28); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
}
function co2(x, y, s, rot) {
  if (s <= .001) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ball(-29, 0, 17, '#FF6B6B'); ball(29, 0, 17, '#FF6B6B'); ball(0, 0, 21, '#DFE7F0');
  ctx.restore();
}
function o2(x, y, s, rot) {
  if (s <= .001) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ball(-15, 0, 19, '#FF6B6B'); ball(15, 0, 19, '#FF6B6B');
  ctx.restore();
}
function hexPath(r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.PI / 6; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
}
function glucose(x, y, s, rot) {
  if (s <= .001) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.lineJoin = 'round';
  hexPath(36); ctx.fillStyle = '#FFC53D'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#C98A00'; ctx.stroke();
  hexPath(21); ctx.lineWidth = 5; ctx.strokeStyle = '#FFF2C2'; ctx.stroke();
  ctx.restore();
}
function bowl(t, dead) {
  if (!dead) {
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      for (let k = 0; k <= 12; k++) {
        const yy = -112 - k * 7, xx = i * 48 + Math.sin(k * .7 + t * 6 + i) * 10 * (k / 12 + .3);
        k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
      }
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.ellipse(0, -30, 104, 60, 0, Math.PI, 0); ctx.fill();
  for (const b of [[-62, -60, 30], [-22, -80, 34], [26, -80, 35], [66, -58, 28]]) { circle(b[0], b[1], b[2]); ctx.fill(); }
  ctx.fillStyle = '#D9DEE8';
  for (const b of [[-40, -70], [8, -88], [46, -62], [-8, -52], [-70, -44]]) { ctx.beginPath(); ctx.ellipse(b[0], b[1], 7, 3.5, .5, 0, TAU); ctx.fill(); }
  const body = () => {
    ctx.beginPath(); ctx.moveTo(-122, -30); ctx.lineTo(122, -30);
    ctx.bezierCurveTo(120, 52, 72, 94, 52, 94); ctx.lineTo(-52, 94);
    ctx.bezierCurveTo(-72, 94, -120, 52, -122, -30); ctx.closePath();
  };
  body(); ctx.fillStyle = '#F1F4FA'; ctx.fill();
  ctx.save(); body(); ctx.clip();
  ctx.fillStyle = '#3F7BFF'; ctx.fillRect(-130, 6, 260, 20);
  ctx.fillStyle = 'rgba(20,40,90,.14)'; ctx.fillRect(30, -30, 100, 130);
  ctx.restore();
  rr(-46, 90, 92, 20, 6); ctx.fillStyle = '#C9D0DD'; ctx.fill();
  rr(-130, -42, 260, 22, 11); ctx.fillStyle = '#FFFFFF'; ctx.fill();
}
function chloroMini(x, y, rx, ry, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fillStyle = '#0A5C30'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, rx * .82, ry * .72, 0, 0, TAU); ctx.fillStyle = '#58D85A'; ctx.fill();
  ctx.restore();
}
const GRANA = [[-196, 8, 4], [-104, -58, 5], [-88, 74, 3], [4, 4, 5], [102, -62, 4], [108, 62, 4], [202, 0, 4]];
function chloroplast(x, y, s, lit, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.ellipse(0, 0, 330, 200, 0, 0, TAU); ctx.fillStyle = '#0A5C30'; ctx.fill();
  const g = ctx.createLinearGradient(0, -180, 0, 180);
  g.addColorStop(0, '#8BEF5E'); g.addColorStop(1, '#2FB855');
  ctx.beginPath(); ctx.ellipse(0, 0, 304, 176, 0, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, 0, 276, 150, 0, Math.PI * 1.12, Math.PI * 1.42); ctx.stroke();
  ctx.strokeStyle = '#1B9A4C'; ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(-196, 8); ctx.lineTo(-104, -40); ctx.lineTo(4, -6); ctx.lineTo(102, -62); ctx.lineTo(202, -6);
  ctx.moveTo(-196, 20); ctx.lineTo(-88, 74); ctx.lineTo(4, 30); ctx.lineTo(108, 62); ctx.lineTo(202, 12);
  ctx.stroke();
  GRANA.forEach((st, i) => {
    for (let k = 0; k < st[2]; k++) {
      const yy = st[1] + (k - (st[2] - 1) / 2) * 20;
      const l = lit > 0 ? clamp(lit * 1.35 - i * .05 + .22 * Math.sin(t * 26 + i * 2.1 + k * 1.3)) : 0;
      rr(st[0] - 40, yy - 8, 80, 16, 8); ctx.fillStyle = l > 0 ? mix('#0E7A3C', '#FFE85A', l) : '#0E7A3C'; ctx.fill();
      rr(st[0] - 31, yy - 5.5, 38, 4, 2); ctx.fillStyle = 'rgba(255,255,255,.26)'; ctx.fill();
    }
  });
  ctx.restore();
}
const chemSegs = s => s.split(/(\d+)/).filter(Boolean);
function chemW(str, size) { let w = 0; for (const sg of chemSegs(str)) w += /\d/.test(sg) ? mw(sg, size * .62, 800) : mw(sg, size, 800); return w; }
function chem(str, x, y, size, color) {
  let cx = x - chemW(str, size) / 2;
  for (const sg of chemSegs(str)) {
    const sub = /\d/.test(sg), sz = sub ? size * .62 : size, w = mw(sg, sz, 800);
    T(sg, cx + w / 2, y + (sub ? size * .3 : 0), sz, { color, w: 800, fat: .02 });
    cx += w;
  }
}
function label(t, t0, word, chipStr, x, y, size, color, align, o) {

    const edge = i => lerp(-560, W + 760, E.inOut(prog(t, 10.4 + i * .035, 10.7 + i * .035)));
    const poly = x => { ctx.beginPath(); ctx.moveTo(-80, -80); ctx.lineTo(x + 250, -80); ctx.lineTo(x - 250, H + 80); ctx.lineTo(-80, H + 80); ctx.closePath(); };
    if (wiping) STRIPES.forEach((c, i) => { poly(edge(i)); ctx.fillStyle = c; ctx.fill(); });
    ctx.save();
    if (wiping) { poly(edge(4)); ctx.clip(); }
    scene5(t);
    ctx.restore();
  }
  if (t >= 12.5 && t < 12.76) {
    const R = lerp(1270, 0, E.inCubic(prog(t, 12.5, 12.74)));
    ctx.beginPath(); ctx.rect(-80, -80, W + 160, H + 160); ctx.arc(960, 540, R, 0, TAU, true);
    ctx.fillStyle = '#04140D'; ctx.fill('evenodd');
    if (R > 4) { ctx.lineWidth = 16; ctx.strokeStyle = '#B8FF5A'; circle(960, 540, R); ctx.stroke(); }
  }
  if (t >= 12.74) scene6(t, life);
  ctx.restore();

  // 플래시
  for (const f of FLASHES) {
    const d = t - f[0]; if (d < 0 || d > .5) continue;
    ctx.fillStyle = 'rgba(' + f[2] + ',' + (f[1] * Math.exp(-d * 13)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);
  }
  // 비네트
  const in2 = prog(t, 2.7, 2.93) * (1 - prog(t, 4.6, 4.8)), in5 = prog(t, 10.6, 10.84) * (1 - prog(t, 12.5, 12.74));
  const va = lerp(lerp(.46, .2, in2), .12, in5);
  const vg = ctx.createRadialGradient(960, 540, 520, 960, 540, 1180);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + va + ')');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // 필름 그레인
  if (!grainPat) {
    const c = document.createElement('canvas'); c.width = c.height = 200;
    const x = c.getContext('2d'), id = x.createImageData(200, 200);
    for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255 | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    x.putImageData(id, 0, 0);
    grainPat = ctx.createPattern(c, 'repeat');
  }
  const fr = Math.floor(life * 24);
  ctx.save(); ctx.globalAlpha = .05; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(-rnd(fr) * 200, -rnd(fr + 77) * 200);
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 200, H + 200);
  ctx.restore();
}

/* ───────────────────────── 소리 (Web Audio 합성) ───────────────────────── */
let AC = null, master = null, bus = null, send = null, rev = null, noiseBuf = null;
let soundOn = false, everSound = false, cueIdx = 0;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);

function initAudio() {
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return false;
  AC = new C();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = .004; comp.release.value = .2;
  master = AC.createGain(); master.gain.value = .85; master.connect(comp); comp.connect(AC.destination);
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const rl = Math.floor(AC.sampleRate * 1.8), ir = AC.createBuffer(2, rl, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const b = ir.getChannelData(c); for (let i = 0; i < rl; i++) b[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6); }
  rev = AC.createConvolver(); rev.buffer = ir;
  const rg = AC.createGain(); rg.gain.value = .45; rev.connect(rg); rg.connect(master);
  newBus();
  return true;
}
function newBus() {
  if (!AC) return;
  if (bus) {
    const b = bus, s = send, n = AC.currentTime;
    b.gain.setTargetAtTime(0, n, .015); s.gain.setTargetAtTime(0, n, .015);
    setTimeout(() => { try { b.disconnect(); s.disconnect(); } catch (e) {} }, 400);
  }
  bus = AC.createGain(); bus.connect(master);
  send = AC.createGain(); send.connect(rev);
}
function route(node, wet) {
  node.connect(bus);
  if (wet) { const g = AC.createGain(); g.gain.value = wet; node.connect(g); g.connect(send); }
}
function envl(g, w, v, a, dur) {

  g.gain.exponentialRampToValueAtTime(.0001, w + dur);
}
function tone(w, f, dur, o) {
  o = o || {};

  os.frequency.setValueAtTime(f, w);
  if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, w + (o.slide || dur));
  if (o.detune) os.detune.value = o.detune;
  const g = AC.createGain(); envl(g, w, o.v || .2, o.a || .006, dur);
  let n = os;
  if (o.lp) { const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; os.connect(fl); n = fl; }
  n.connect(g); route(g, o.wet);

}
function noise(w, dur, o) {

  const f = AC.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || .8;
  f.frequency.setValueAtTime(o.f0 || 1000, w);
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, w + dur);
  const g = AC.createGain(); envl(g, w, o.v || .2, o.a || .004, dur);
  s.connect(f); f.connect(g); route(g, o.wet);
  s.start(w, Math.random()); s.stop(w + dur + .05);
}
const kick = (w, v = .9) => tone(w, 165, .34, { type: 'sine', to: 42, slide: .13, v, a: .003 });
const hat = (w, v = .06) => noise(w, .05, { type: 'highpass', f0: 8500, v });
const clap = (w, v = .15) => noise(w, .15, { type: 'bandpass', f0: 1900, q: .7, v, wet: .3 });
const crash = (w, v = .2) => noise(w, 1.3, { type: 'highpass', f0: 5200, v, wet: .5 });
const bass = (w, m, dur = .24, v = .22) => { tone(w, mf(m), dur, { type: 'sawtooth', lp: 520, v }); tone(w, mf(m), dur, { type: 'sine', v: v * .9 }); };
const pluck = (w, m, v = .1) => { tone(w, mf(m), .26, { type: 'triangle', v, wet: .35 }); tone(w, mf(m + 12), .12, { type: 'sine', v: v * .4, wet: .3 }); };
const bell = (w, m, v = .1) => { tone(w, mf(m), .9, { type: 'sine', v, wet: .6 }); tone(w, mf(m) * 2.76, .35, { type: 'sine', v: v * .25, wet: .5 }); };
const impact = (w, v = 1) => { kick(w, .95 * v); noise(w, .45, { type: 'lowpass', f0: 2600, f1: 180, v: .4 * v, wet: .3 }); tone(w, 55, .7, { type: 'sine', v: .4 * v }); };
const whoosh = (w, dur, v = .2, up = true) => noise(w, dur, { type: 'bandpass', f0: up ? 300 : 5000, f1: up ? 5000 : 300, q: 1.2, v, a: dur * .6, wet: .3 });
const riser = (w, dur, v = .25) => { noise(w, dur, { type: 'bandpass', f0: 500, f1: 9000, q: 1.5, v, a: dur * .92 }); tone(w, 220, dur, { type: 'sawtooth', to: 1760, lp: 2400, v: v * .35, a: dur * .9 }); };
function chord(w, notes, dur, v = .05) {
  notes.forEach(m => {
    tone(w, mf(m), dur, { type: 'sawtooth', lp: 2200, v, a: .012, wet: .5, detune: -7 });
    tone(w, mf(m), dur, { type: 'sawtooth', lp: 2200, v, a: .012, wet: .5, detune: 7 });
  });
}

const cues = [];
const cue = (t, fn) => cues.push({ t, fn });
(function buildScore() {
  // 훅
  cue(.08, w => whoosh(w, .17, .14));
  cue(.25, w => { impact(w, .8); pluck(w, 60, .12); });
  cue(.75, w => { impact(w, .8); pluck(w, 63, .12); });
  cue(1.25, w => { impact(w, 1); noise(w, .22, { type: 'highpass', f0: 3000, v: .3 }); tone(w, 196, .4, { type: 'square', to: 82, lp: 900, v: .12 }); });
  cue(1.75, w => { impact(w, 1); chord(w, [48, 55, 63, 67], .7, .045); });
  cue(2.25, w => { kick(w, .6); riser(w, .5, .26); });
  // 식물 → 엽록체 비트
  const prog4 = [[2.75, 36, [72, 76, 79, 84]], [4.75, 33, [69, 72, 76, 81]], [6.75, 41, [65, 69, 72, 77]]];
  cue(2.75, w => { crash(w, .2); chord(w, [60, 64, 67, 72], .9, .05); });
  for (const sec of prog4) for (let b = 0; b < 4; b++) {
    const tb = sec[0] + b * .5;
    cue(tb, w => { kick(w, .85); bass(w, sec[1]); pluck(w, sec[2][b % 4], .085); });
    cue(tb + .25, w => { hat(w); bass(w, sec[1] + 12, .16, .13); pluck(w, sec[2][(b + 2) % 4], .06); });
    if (b % 2) cue(tb, w => clap(w));
  }
  cue(3.25, w => pluck(w, 84, .1));
  cue(3.75, w => { bell(w, 88, .08); });
  cue(4.42, w => whoosh(w, .5, .22));
  cue(6.25, w => { impact(w, .7); bell(w, 81, .09); });
  cue(7.25, w => { bell(w, 89, .11); noise(w, .3, { type: 'highpass', f0: 7000, v: .08, wet: .5 }); });
  cue(7.75, w => { tone(w, 1300, .16, { type: 'sine', to: 520, v: .16, wet: .4 }); });
  cue(8.25, w => { tone(w, 300, .2, { type: 'triangle', to: 620, v: .16, wet: .4 }); });
  // 충전 → 폭발
  cue(8.75, w => { riser(w, .5, .3); chord(w, [55, 59, 62], .5, .035); });
  [67, 71, 74, 79, 83, 86, 91, 95].forEach((m, i) => cue(8.75 + i * .0625, w => pluck(w, m, .07 + i * .006)));
  cue(9.25, w => { impact(w, 1.1); crash(w, .24); chord(w, [48, 60, 64, 67, 72], 1.2, .05); bell(w, 84, .1); });
  for (let b = 0; b < 3; b++) {
    const tb = 9.25 + b * .5;
    if (b) cue(tb, w => { kick(w, .85); bass(w, 36); });
    cue(tb, w => pluck(w, [76, 79, 84][b], .08));
    cue(tb + .25, w => { hat(w); bass(w, 48, .16, .13); pluck(w, [72, 76, 79][b], .06); });
    if (b % 2) cue(tb, w => clap(w));
  }
  cue(9.75, w => bell(w, 91, .08));
  cue(10.4, w => whoosh(w, .4, .22));
  // 공식
  [[10.75, 65], [11, 69], [11.25, 72], [11.5, 77], [11.75, 81]].forEach((n, i) => cue(n[0], w => { pluck(w, n[1], .13); tone(w, mf(n[1] - 12), .2, { type: 'sine', v: .1 }); }));
  [10.75, 11.25, 11.75, 12.25].forEach((tb, i) => cue(tb, w => { kick(w, .7); bass(w, i < 2 ? 41 : 43); }));
  for (let i = 0; i < 7; i++) cue(10.875 + i * .25, w => hat(w, .05));
  cue(11.25, w => tone(w, 500, .22, { type: 'triangle', to: 1500, v: .07, wet: .4 }));
  cue(11.95, w => clap(w, .1)); cue(12.15, w => clap(w, .1));
  cue(12.42, w => riser(w, .32, .26));
  // 타이틀
  cue(12.75, w => { impact(w, 1); chord(w, [48, 60], .4, .06); });
  cue(13, w => { impact(w, 1); chord(w, [52, 64], .4, .06); });
  cue(13.25, w => { impact(w, 1.15); crash(w, .26); chord(w, [36, 48, 55, 60, 64, 67, 72], 1.9, .042); });
  [84, 88, 91, 96].forEach((m, i) => cue(13.33 + i * .09, w => bell(w, m, .07)));
  cue(13.68, w => { bell(w, 79, .08); whoosh(w, .25, .07); });
  cue(14.15, w => bell(w, 84, .05));
  cues.sort((a, b) => a.t - b.t);
})();

function syncAudio() {
  if (!AC) return;
  newBus();
  cueIdx = cues.findIndex(c => c.t >= T0 - .02);
  if (cueIdx < 0) cueIdx = cues.length;
}
function pumpAudio() {
  if (!soundOn || !AC || !playing) return;
  while (cueIdx < cues.length && cues[cueIdx].t < T0 + .12) {
    const c = cues[cueIdx++], dt = c.t - T0;
    if (dt > -.04) { try { c.fn(AC.currentTime + Math.max(0, dt)); } catch (e) {} }
  }
}

/* ───────────────────────── 재생 제어 ───────────────────────── */
const qs = new URLSearchParams(location.search);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let T0 = 0, playing = true, lifeT = 0, last = performance.now(), idleTimer = 0;
if (qs.has('clean')) stage.classList.add('clean');
if (qs.has('t')) { T0 = clamp(parseFloat(qs.get('t')) || 0, 0, DUR); lifeT = T0; playing = false; }
else if (reduce || qs.get('autoplay') === '0') { T0 = DUR; playing = false; }

const $ = id => document.getElementById(id);
const bPlay = $('bPlay'), bSound = $('bSound'), bFull = $('bFull'), seek = $('seek'), timeEl = $('time'), pill = $('pill'), again = $('again');
const ICON = {
  pause: 'M6 5h4v14H6zm8 0h4v14h-4z', play: 'M7 4.5v15l13-7.5z',
  replay: 'M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z',
  on: 'M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z',
  off: 'M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z'
};
let uiKey = '';
function refreshUI() {
  const ended = T0 >= DUR, key = (playing ? 'p' : ended ? 'e' : 's') + (soundOn ? '1' : '0');
  if (key !== uiKey) {
    uiKey = key;
    $('iPlay').setAttribute('d', playing ? ICON.pause : ended ? ICON.replay : ICON.play);
    bPlay.setAttribute('aria-label', playing ? '일시정지' : ended ? '다시 보기' : '재생');
    $('iSound').setAttribute('d', soundOn ? ICON.on : ICON.off);
    bSound.setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
    stage.classList.toggle('paused', !playing && !ended);
    stage.classList.toggle('ended', ended);
    stage.classList.toggle('sound', soundOn);
  }
  if (document.activeElement !== seek || playing) seek.value = T0.toFixed(2);
  seek.style.setProperty('--p', (T0 / DUR * 100).toFixed(2) + '%');
  const sec = Math.min(DUR, Math.floor(T0 + .001));
  const txt = '0:' + String(sec).padStart(2, '0') + ' / 0:15';
  if (timeEl.textContent !== txt) timeEl.textContent = txt;
}
function play() { if (T0 >= DUR) T0 = 0; playing = true; last = performance.now(); syncAudio(); }
function pause() { playing = false; if (AC) newBus(); }
function toggle() { playing ? pause() : play(); }
function seekTo(v) { T0 = clamp(v, 0, DUR); syncAudio(); }
function restart() { T0 = 0; play(); }
function setSound(on) {
  if (on && !AC && !initAudio()) return;
  soundOn = on;
  if (AC) {
    if (on) AC.resume();
    master.gain.setTargetAtTime(on ? .85 : 0, AC.currentTime, .02);
  }
  if (on && !everSound) { everSound = true; restart(); }
  else if (on) syncAudio();
}
function fullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
}
function wake() {
  stage.classList.add('show'); stage.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { stage.classList.remove('show'); if (playing) stage.classList.add('idle'); }, 2400);
}

cv.addEventListener('click', toggle);
cv.addEventListener('dblclick', fullscreen);
stage.addEventListener('mousemove', wake);
stage.addEventListener('touchstart', wake, { passive: true });
bPlay.addEventListener('click', toggle);
bSound.addEventListener('click', () => setSound(!soundOn));
bFull.addEventListener('click', fullscreen);
pill.addEventListener('click', () => setSound(true));
again.addEventListener('click', restart);
seek.addEventListener('input', () => seekTo(parseFloat(seek.value)));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inSeek = e.target === seek, onBtn = e.target.tagName === 'BUTTON';
  const k = e.key;
  if ((k === ' ' || k === 'Enter') && onBtn) return;
  if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); toggle(); }
  else if (k === 'r' || k === 'R' || k === 'Home') { e.preventDefault(); restart(); }
  else if (k === 'm' || k === 'M') setSound(!soundOn);
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'ArrowLeft' && !inSeek) seekTo(T0 - 1);
  else if (k === 'ArrowRight' && !inSeek) seekTo(T0 + 1);
  else return;
  wake();
});
setTimeout(() => stage.classList.remove('hint'), 7000);

function frame(now) {
  const dt = Math.min(.1, Math.max(0, (now - last) / 1000));
  last = now;
  if (playing || !reduce) lifeT += dt;
  if (playing) {
    T0 += dt;
    if (T0 >= DUR) { T0 = DUR; playing = false; }
  }
  pumpAudio();
  render(T0, lifeT);
  refreshUI();
  requestAnimationFrame(frame);
}
render(T0, lifeT);
refreshUI();
requestAnimationFrame(frame);
})();
