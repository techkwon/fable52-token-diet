:root{color-scheme:dark;--night:#04100C;--paper:#F4FFF8;--green:#19E57F}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night)}
body{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{width:100%;height:100%;display:grid;place-items:center}
#film{display:block;width:min(100vw,177.777778vh);height:min(56.25vw,100vh);overflow:hidden;isolation:isolate}
svg text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.03em;font-weight:700;dominant-baseline:central;fill:#F4FFF8}
.counter{font-size:7px;font-weight:900;font-variant-numeric:tabular-nums}.headline{font-size:5px;font-weight:900}.label{font-size:2.6px}.caption{font-size:1.8px}.mega{font-size:20px;font-weight:900}
#controls{position:fixed;z-index:5;bottom:18px;left:50%;transform:translate(-50%,10px);display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid #f4fff825;border-radius:14px;background:#04100ceb;backdrop-filter:blur(18px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:94vw}
body.controls #controls,#controls:focus-within{opacity:1;transform:translate(-50%,0);pointer-events:auto}
button{display:grid;place-items:center;background:none;color:var(--paper);border:0;width:30px;height:30px;padding:4px;cursor:pointer;border-radius:6px}button:hover{background:#f4fff815}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:4px}button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#seek{width:clamp(90px,20vw,260px);height:3px;accent-color:var(--green);cursor:pointer}#time{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#B8C4C0;letter-spacing:.02em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:500px){#controls{gap:6px;padding:8px}#time{display:none}}
</style>

function layoutEquation(){attr($('question1b'),'x',56+$('question1').getComputedTextLength()+1.2);attr($('question2b'),'x',56+$('question2').getComputedTextLength()+1.2);const widths=equation.map(e=>e.getComputedTextLength()),total=widths.reduce((a,b)=>a+b,0)+8*1.15;let x=(100-total)/2;equationPositions=widths.map(w=>{let v=x;x+=w+1.15;return v;});equation.forEach((e,i)=>attr(e,'x',equationPositions[i]));}
const frames={};for(const id of ['film','forest','seed','seed-label','ground','trunk','counter','question1','question2','soil','strike','information','dive','microscope','cell-pattern','glow','chloroplast','chloroplast-label','light-beams','light-label','water-label','carbon-label','shock','glucose','glucose-label','oxygen-label','flash','wipe','end-title','title-glyphs','subtitle','night'])frames[id]=$(id);
const f=frames;
function render(t){
 now=Math.max(0,Math.min(15000,t));
 f.film.dataset.time=now.toFixed(1);
 // Scenes 1–2: seed, growth, weigh-in and the soil misconception.
 opacity(f.forest,now<6100?1:0);about(f.forest,50,28.125,1+.05*clamp(now/5200));

 draw(f.trunk,21,p(1000,900));branches.forEach((b,i)=>draw(b.el,b.length,p(1300+i*90,500)));
 canopy.forEach((c,i)=>{about(c.el,c.x,c.y,p(1720+i*110,500,BACK));opacity(c.el,now>1720+i*110?1:0);});
 const value=Math.round(1000*p(1100,2000,INOUT));f.counter.textContent=value.toLocaleString('en-US')+' kg';opacity(f.counter,now>=1100?1:0);
 const punch=now<3250?lerp(1,1.25,p(3100,150,BACK)):lerp(1.25,1,p(3250,150,BACK));about(f.counter,56,17,punch);attr(f.counter,'style','fill:'+mix(C.paper,C.sun,p(3100,300,BACK)));
 ['question1','question1b','question2','question2b'].forEach((id,i)=>{let start=3200+i*120;move($(id),0,6.05*(1-p(start,500)));opacity($(id),now>=start?1:0);});
 const shake=now>=4500&&now<4740?Math.sin((now-4500)/240*Math.PI*6)*.6:0;
 attr(f.soil,'transform',`translate(${59+shake} 41) scale(${p(4000,300,BACK)}) translate(-59 -41)`);opacity(f.soil,1-.65*p(4740,200));
 attr(f.strike,'transform',`translate(55 42.2) scale(${p(4500,200)} 1) translate(-55 -42.2)`);
 move(f.information,4*p(5100,250,IN),0);opacity(f.information,1-p(5100,250,IN));
 // One physical leaf expands. No cross-fade or cut at the dive.

 let diveScale=lerp(1,30,p(5200,900,INOUT)),forestScale=1+.05*clamp(now/5200),heroX=50+(32-50)*forestScale,heroY=28.125+(17-28.125)*forestScale;
 attr(f.dive,'transform',`translate(${heroX} ${heroY}) scale(${diveScale*forestScale}) translate(-32 -17)`);attr(f.dive,'fill',mix(C.green,C.deep,p(5700,400,LINEAR)));
 // Cellular space, with accelerating chloroplast oscillation.

 const elapsed=Math.max(0,Math.min(now,10280)-6900),k=(1200-300)/3380,cycles=elapsed>0?Math.log(1200/(1200-k*elapsed))/k:0;
 let pulse=1+.02*(1-Math.cos(2*Math.PI*cycles)),chlorScale=p(6300,600,BACK)*pulse;
 if(now>=10280&&now<10400)chlorScale=lerp(pulse,.7,p(10280,120,IN));
 if(now>=10400)chlorScale=now<10620?lerp(.7,1.15,p(10400,220,BACK)):lerp(1.15,1,p(10620,280,BACK));
 move(f.chloroplast,50,26,chlorScale);opacity(f.glow,.9*p(6900,3380,LINEAR));opacity(f['chloroplast-label'],p(6600,300));
 beams.forEach((b,i)=>draw(b.el,b.len,p(6900+i*60,400)));opacity(f['light-beams'],1-p(10400,200));
 for(const [id,start,x,y] of [['light-label',6900,14,12],['water-label',7700,16,44],['carbon-label',8500,82,12]]){let q=p(start,350,BACK);about(f[id],x,y,lerp(.6,1,q));opacity(f[id],clamp(q)*(1-p(10400,200)));}

// A single master clock drives every object. Seeking is deterministic.
let playing=true,origin=performance.now(),offset=0,raf=0,lastTime=0,ready=false;
function tick(timestamp){if(ready&&playing){const t=(timestamp-origin+offset)%15000;if(t<lastTime)resetAudio();render(t);soundTick(lastTime,t);lastTime=t;}raf=requestAnimationFrame(tick);}
function setPlaying(value){playing=value;if(value){origin=performance.now();offset=now;}else{offset=now;stopAudio();}attr($('play-icon'),'d',value?'M8 5V19M16 5V19':'M8 4L20 12L8 20Z');$('play').setAttribute('aria-label',value?'일시 정지':'재생');}
function seek(ms){offset=Math.max(0,Math.min(14999,ms));origin=performance.now();lastTime=offset;resetAudio();render(offset);}
$('play').onclick=()=>setPlaying(!playing);$('replay').onclick=()=>{seek(0);setPlaying(true);};$('seek').oninput=e=>seek(+e.target.value);
$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});};
// Optional original synthesized sound design. Silent autoplay is browser-safe.
let audio=null,master=null,soundEnabled=false,voices=[],fired=new Set();
function stopAudio(){voices.forEach(o=>{try{o.stop();}catch{}});voices=[];}
function resetAudio(){stopAudio();fired.clear();}
function tone(freq,duration,volume=.1,type='sine',endFreq=freq){if(!audio||!soundEnabled)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),t+duration);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(master);o.start(t);o.stop(t+duration);voices.push(o);o.onended=()=>{voices=voices.filter(v=>v!==o);o.disconnect();g.disconnect();};}
const cues=[[550,()=>tone(120,.23,.25,'sine',45)],[1000,()=>tone(160,1.5,.08,'triangle',480)],[1720,()=>tone(330,.8,.08)],[2160,()=>tone(440,.8,.07)],[2600,()=>tone(660,.7,.07)],[3100,()=>{tone(65,.6,.28);tone(880,.7,.09);}],[4500,()=>tone(180,.18,.12,'sawtooth',70)],[5200,()=>tone(120,1,.12,'triangle',1000)],[6900,()=>tone(660,.5,.08)],[7700,()=>tone(440,.6,.08)],[8500,()=>tone(330,.7,.08)],[10400,()=>{tone(58,1,.3);tone(1200,.5,.12,'triangle',220);}],[12200,()=>tone(130,.6,.14,'triangle',520)],[12550,()=>{[130.81,261.63,329.63,392].forEach(v=>tone(v,1.8,.07));}]];
function soundTick(prev,t){if(!soundEnabled)return;cues.forEach(([at,fn],i)=>{if(t>=at&&prev<at&&!fired.has(i)){fired.add(i);fn();}});if(t>=6900&&t<10280){let interval=lerp(1200,300,clamp((t-6900)/3380)),n=Math.floor((t-6900)/interval),key='pulse'+n;if(!fired.has(key)){fired.add(key);tone(90,.12,.08);}}}
$('sound').onclick=async()=>{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=.5;master.connect(audio.destination);}await audio.resume();soundEnabled=!soundEnabled;if(!soundEnabled)stopAudio();$('sound').setAttribute('aria-label',soundEnabled?'소리 끄기':'소리 켜기');attr($('sound-icon'),'d',soundEnabled?'M16 8Q20 12 16 16M19 5Q26 12 19 19':'M16 9L22 15M22 9L16 15');};
let hideControls;function showControls(){document.body.classList.add('controls');clearTimeout(hideControls);hideControls=setTimeout(()=>document.body.classList.remove('controls'),1800);}
document.addEventListener('pointermove',showControls);document.addEventListener('pointerdown',showControls);document.addEventListener('keydown',e=>{showControls();if(e.target.matches('input,button'))return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();setPlaying(!playing);}if(k==='r')$('replay').click();if(k==='m')$('sound').click();if(k==='f')$('fullscreen').click();if(k==='arrowright'){e.preventDefault();seek(now+1000);}if(k==='arrowleft'){e.preventDefault();seek(now-1000);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){offset=now;stopAudio();}else{origin=performance.now();lastTime=offset;}});
// Public inspection surface for frame-accurate review and offline capture.
window.__film={seek,play:()=>setPlaying(true),pause:()=>setPlaying(false),get time(){return now;},duration:15000,render};
render(0);
document.fonts.ready.then(()=>{layoutEquation();origin=performance.now();ready=true;const params=new URLSearchParams(location.search);if(params.has('t')){setPlaying(false);seek(Number(params.get('t'))||0);}raf=requestAnimationFrame(tick);});
})();
