<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLAUDE — Motion Showreel 2026</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#f3efe6;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;cursor:pointer}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:22px 28px 20px;display:flex;align-items:center;gap:18px;
    background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transform:translateY(8px);
    transition:opacity .35s,transform .35s;font:500 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em}
  body.ui #ui{opacity:1;transform:none}
  #ui button{background:none;border:1px solid rgba(243,239,230,.35);color:#f3efe6;font:inherit;letter-spacing:inherit;
    padding:8px 12px;border-radius:999px;cursor:pointer;min-width:44px;transition:background .2s,border-color .2s}
  #ui button:hover{background:rgba(243,239,230,.12);border-color:#f3efe6}
  #ui button.on{background:#f3efe6;color:#0b0b10}
  #bar{position:relative;flex:1;height:22px;cursor:pointer}
  #bar .track{position:absolute;left:0;right:0;top:10px;height:2px;background:rgba(243,239,230,.22)}
  #bar .fill{position:absolute;left:0;top:10px;height:2px;background:#ff3b2f;width:0}
  #bar .head{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f3efe6}
  #bar .mk{position:absolute;top:6px;width:1px;height:10px;background:rgba(243,239,230,.5)}
  #bar .mk span{position:absolute;bottom:14px;left:-30px;width:60px;text-align:center;font-size:9px;opacity:.0;transition:opacity .2s;white-space:nowrap}
  #bar:hover .mk span{opacity:.7}
  #time{min-width:120px;text-align:right;opacity:.85}
  #hint{position:fixed;top:22px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;
    background:rgba(11,11,16,.72);border:1px solid rgba(243,239,230,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font:600 11px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.18em;cursor:pointer;
    animation:pulse 2s ease-in-out infinite;transition:opacity .4s}
  #hint.gone{opacity:0;pointer-events:none}
  #hint i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3b2f;margin-right:10px;vertical-align:1px}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,59,47,.0),0 0 24px rgba(255,59,47,.35)}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Motion design showreel animation"></canvas></div>
<div id="hint"><i></i>CLICK FOR SOUND ♪</div>
<div id="ui">
  <button id="bPlay" title="Play / Pause (Space)">❚❚</button>
  <div id="bar"><div class="track"></div><div class="fill"></div><div class="head"></div></div>
  <span id="time">00:00:00 / 00:15:00</span>
  <button id="bSnd" title="Sound (M)">♪ OFF</button>
</div>
<script>
'use strict';
/* =====================================================================
   CLAUDE — MOTION SHOWREEL 2026
   15 seconds · 7 scenes · 120 BPM · fully procedural (canvas + WebAudio)
   Everything is a pure function of time t, so it scrubs, loops and
   renders deterministically. Append ?t=6.2 to the URL to freeze a frame.
   ===================================================================== */

const W = 1920, H = 1080, DUR = 15, FPS = 30, TAU = Math.PI * 2;
const F = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
const C = {
  ink:'#0b0b10', ink2:'#17171f', paper:'#f3efe6', red:'#ff3b2f', blue:'#2f3cff', yellow:'#ffd02e',
  mint:'#19e3a6', pink:'#ff4fb8', orange:'#ff7a1a', violet:'#7b4dff'
};

/* ---------------- math / easing ---------------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const mod = (a, n) => ((a % n) + n) % n;
const E = {
  linear: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutQuart: x => x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inBack: x => { const c1 = 1.70158, c3 = c1 + 1; return c3 * x * x * x - c1 * x * x; },
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * TAU / 3) + 1,
  outBounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; }
};
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x) { x = ((x >>> 16) ^ x) * 0x45d9f3b; x = ((x >>> 16) ^ x) * 0x45d9f3b; return ((x >>> 16) ^ x) >>> 0; }
const RGB = {};
function toRGB(h) { return RGB[h] || (RGB[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]); }
const rgba = (h, a) => { const c = toRGB(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const mixC = (a, b, t) => { const A = toRGB(a), B = toRGB(b); t = clamp(t); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; };
const pad = (n, l = 2) => String(n).padStart(l, '0');

/* ---------------- canvas setup ---------------- */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d');
let SCALE = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.round(W * s), ch = Math.round(H * s);
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.max(2, Math.round(cw * dpr)); cvs.height = Math.max(2, Math.round(ch * dpr));
  buf.width = cvs.width; buf.height = cvs.height;
  SCALE = cvs.width / W;
}
addEventListener('resize', resize); resize();

const setLS = v => { if ('letterSpacing' in ctx) ctx.letterSpacing = v; };
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const bg = c => { ctx.fillStyle = c; ctx.fillRect(-4, -4, W + 8, H + 8); };
let FR = 0; // current frame index, used as a seed for flickery things

const GLY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+=/<>?';
function scramble(str, p, seed = FR) {
  const n = str.length, span = 7, head = p * (n + span);
  let s = '';
  for (let i = 0; i < n; i++) {
    const ch = str[i];
    if (head >= i + span || (ch === ' ' && head >= i)) s += ch;
    else if (head >= i) s += GLY[hash(i * 131 + seed * 17 + 7) % GLY.length];
    else s += ' ';
  }
  return s;
}

/* ---------------- shapes ---------------- */
function polyV(n, r, rot, oy = 0) { const v = []; for (let k = 0; k < n; k++) { const a = rot + TAU * k / n; v.push([Math.cos(a) * r, Math.sin(a) * r + oy]); } return v; }
function starV(n, r1, r2) { const v = []; for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + Math.PI * k / n, r = k % 2 ? r2 : r1; v.push([Math.cos(a) * r, Math.sin(a) * r]); } return v; }
function sampleClosed(v, N) {
  const L = []; let tot = 0;
  for (let i = 0; i < v.length; i++) { const a = v[i], b = v[(i + 1) % v.length]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); L.push(l); tot += l; }
  const out = []; let ei = 0, acc = 0;
  for (let k = 0; k < N; k++) {
    const d = tot * k / N;
    while (ei < L.length - 1 && acc + L[ei] < d) { acc += L[ei]; ei++; }
    const f = (d - acc) / L[ei], a = v[ei], b = v[(ei + 1) % v.length];
    out.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]);
  }
  let best = 0, bd = 1e9;
  out.forEach((p, i) => { const d = Math.abs(Math.atan2(p[1], p[0]) + Math.PI / 2) + (p[1] > 0 ? 9 : 0); if (d < bd) { bd = d; best = i; } });
  return out.slice(best).concat(out.slice(0, best));
}
const SN = 200, SR = 200;
const SH = {
  circle: sampleClosed(polyV(96, SR, -Math.PI / 2), SN),
  square: sampleClosed(polyV(4, SR * 1.25, -Math.PI / 4), SN),
  tri: sampleClosed(polyV(3, SR * 1.45, -Math.PI / 2), SN),
  star: sampleClosed(starV(5, SR * 1.42, SR * 0.6), SN)
};
function pathPts(pts, dx = 0, dy = 0) { ctx.beginPath(); for (let i = 0; i < pts.length; i += 2) i ? ctx.lineTo(pts[i] + dx, pts[i + 1] + dy) : ctx.moveTo(pts[i] + dx, pts[i + 1] + dy); ctx.closePath(); }
function miniShape(kind, x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  if (kind === 0) ctx.arc(0, 0, s, 0, TAU);
  else if (kind === 1) ctx.rect(-s, -s, s * 2, s * 2);
  else if (kind === 2) { for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + TAU * k / 3; ctx.lineTo(Math.cos(a) * s * 1.3, Math.sin(a) * s * 1.3); } ctx.closePath(); }
  else { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + Math.PI * k / 5, r = k % 2 ? s * .55 : s * 1.3; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); }
  ctx.fill(); ctx.restore();
}

/* =====================================================================
   SCENE 1 · IGNITION (0 – 2.5s)
   dot → squash/stretch line → split bars → masked type → zoom-through
   ===================================================================== */
function s1(t) {
  bg(C.ink);
  const cx = W / 2, cy = H / 2;
  const gA = seg(t, .3, 1.0) * (1 - seg(t, 1.7, 2.05)) * .07;
  if (gA > .001) {
    ctx.strokeStyle = rgba(C.paper, gA); ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W; x += 80) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (let y = 60; y <= H; y += 80) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
  }
  [.33, .47].forEach((s, i) => {
    const p = seg(t, s, s + 1.0);
    if (p > 0 && p < 1) { ctx.strokeStyle = rgba(C.paper, (1 - p) * .5); ctx.lineWidth = 2 - i; ctx.beginPath(); ctx.arc(cx, cy, 20 + 760 * E.outExpo(p), 0, TAU); ctx.stroke(); }
  });

  if (t < 1.8) {
    const r = 14 * E.outBack(seg(t, .02, .34));
    const ps = seg(t, .4, .78);
    const w = lerp(r * 2, 1640, E.inOutExpo(ps));
    const h = lerp(r * 2, 6, E.outExpo(seg(t, .42, .62)));
    const cols = [C.red, C.yellow, C.mint, C.pink, C.paper];
    const offs = [-2, -1, 1, 2, 0];
    offs.forEach((o, j) => {
      const sp = E.outExpo(seg(t, .72 + Math.abs(o) * .04, 1.15 + Math.abs(o) * .04));
      const y = cy + o * 74 * sp;
      const pr = E.inOutExpo(seg(t, .98 + (o + 2) * .06, 1.42 + (o + 2) * .06));
      const x0 = cx - w / 2 + w * pr, x1 = cx + w / 2;
      if (x1 - x0 < .5 || r <= 0) return;
      ctx.fillStyle = cols[j]; rr(x0, y - h / 2, x1 - x0, h, h / 2); ctx.fill();
    });
  }

  const TXT = 'MOTION';
  ctx.font = `900 300px ${F}`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const tw = ctx.measureText(TXT).width, x0 = cx - tw / 2, base = cy + 108;
  const Ix = x0 + ctx.measureText('MOT').width + ctx.measureText('I').width / 2, Iy = base - 106;
  const zp = E.inExpo(seg(t, 2.0, 2.47));
  const z = Math.pow(70, zp);
  ctx.save();
  ctx.translate(Ix + (cx - Ix) * zp, Iy + (cy - Iy) * zp); ctx.scale(z, z); ctx.translate(-Ix, -Iy);
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 60, base - 310, tw + 120, 322); ctx.clip();
  for (let i = 0; i < TXT.length; i++) {
    const p = E.outExpo(seg(t, .86 + i * .055, 1.5 + i * .055));
    if (p <= 0) continue;
    const lx = x0 + ctx.measureText(TXT.slice(0, i)).width;
    ctx.fillStyle = C.paper;
    ctx.save(); ctx.translate(lx, base + (1 - p) * 310); ctx.rotate((1 - p) * .25); ctx.fillText(TXT[i], 0, 0); ctx.restore();
  }
  ctx.restore();
  const bw = tw * E.outExpo(seg(t, 1.35, 1.85));
  if (bw > 1) { ctx.fillStyle = C.red; ctx.fillRect(x0 + 6, base + 26, bw - 12, 9); }
  const sp = seg(t, 1.45, 1.95);
  if (sp > 0) {
    ctx.font = `500 24px ${MONO}`; ctx.textAlign = 'center'; setLS('7px');
    ctx.fillStyle = rgba(C.paper, .85);
    ctx.fillText(scramble('SHOWREEL 2026 — CLAUDE / MOTION DESIGN', sp), cx, base + 96);
    setLS('0px');
  }
  ctx.restore();

  if (zp > 0 && zp < 1) {
    const R = rng(77); ctx.strokeStyle = rgba(C.paper, .45 * Math.sin(zp * Math.PI)); ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 48; i++) {
      const a = R() * TAU, r0 = 200 + R() * 300 + zp * 900, l = 80 + R() * 400 * zp;
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * (r0 + l), cy + Math.sin(a) * (r0 + l));
    }
    ctx.stroke();
  }
  const fill = seg(t, 2.38, 2.5);
  if (fill > 0) { ctx.fillStyle = rgba(C.paper, fill); ctx.fillRect(0, 0, W, H); }
}

/* =====================================================================
   SCENE 2 · SHAPE & FORM (2.5 – 5.0s)
   point-based morphing w/ overshoot, squash & stretch, tool UI overlay
   ===================================================================== */
const KEYS = [
  { s: SH.circle, c: C.red, r: 0, n: 'ELLIPSE' },
  { s: SH.square, c: C.ink, r: Math.PI / 2, n: 'RECTANGLE' },
  { s: SH.tri, c: C.yellow, r: TAU * 2 / 3, n: 'POLYGON · 3' },   // rotations land on each shape's symmetry
  { s: SH.star, c: C.pink, r: TAU, n: 'STAR · 5' },
  { s: SH.circle, c: C.blue, r: TAU * 1.5, n: 'ELLIPSE' }
];
function s2(lt, t) {
  bg(C.paper);
  const cx = W / 2, cy = H / 2 - 10;
  const out = seg(lt, 2.02, 2.22), ui = 1 - out;

  ctx.fillStyle = rgba(C.ink, .1 * ui);
  for (let y = 20; y < H; y += 40) for (let x = 20; x < W; x += 40) ctx.fillRect(x - 1, y - 1, 2, 2);
  ctx.save(); ctx.font = `900 600px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 2; ctx.strokeStyle = rgba(C.ink, .08 * ui); ctx.strokeText('FORM', cx + 220 - lt * 140, cy + 20); ctx.restore();

  let k = 0, p = 0;
  for (let i = 0; i < 4; i++) { const st = .5 + i * .5; if (lt >= st) { k = i; p = seg(lt, st, st + .42); } }
  const A = KEYS[k], B = KEYS[k + 1];
  const e = E.outBack(p), ec = E.outCubic(p);
  const rot = lerp(A.r, B.r, e);
  const col = mixC(A.c, B.c, ec);
  const hop = Math.sin(Math.PI * p);
  const sy = 1 + .26 * Math.sin(p * TAU) * (1 - p);
  const sx = 1 / sy;
  let sc = E.outElastic(seg(lt, 0, .75));
  sc *= 1 + 6.8 * E.inExpo(seg(lt, 2.08, 2.5));
  const yOff = -110 * hop * ui;

  const cs = Math.cos(rot), sn = Math.sin(rot);
  const pts = new Array(SN * 2);
  let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
  for (let i = 0; i < SN; i++) {
    const a = A.s[i], b = B.s[i];
    const x = lerp(a[0], b[0], e), y = lerp(a[1], b[1], e);
    const X = cx + (x * cs - y * sn) * sx * sc, Y = cy + yOff + (x * sn + y * cs) * sy * sc;
    pts[i * 2] = X; pts[i * 2 + 1] = Y;
    if (X < mnx) mnx = X; if (X > mxx) mxx = X; if (Y < mny) mny = Y; if (Y > mxy) mxy = Y;
  }

  // ripples on the beat
  for (let i = 0; i < 4; i++) {
    const b = .5 + i * .5, q = seg(lt, b, b + .75);
    if (q <= 0 || q >= 1) continue;
    ctx.strokeStyle = rgba(KEYS[i + 1].c, (1 - q) * .8 * ui); ctx.lineWidth = 6 * (1 - q) + 1;
    ctx.beginPath(); ctx.arc(cx, cy, 240 + 520 * E.outExpo(q), 0, TAU); ctx.stroke();
  }
  // floor shadow
  ctx.fillStyle = rgba(C.ink, .12 * ui * clamp(sc));
  ctx.beginPath(); ctx.ellipse(cx, cy + 290, 200 * (1 - .35 * hop) * clamp(sc, 0, 1.2), 22 * (1 - .3 * hop), 0, 0, TAU); ctx.fill();

  // orbiting satellites w/ trails (pseudo-3D)
  const sats = [];
  for (let j = 0; j < 3; j++) {
    for (let m = 7; m >= 0; m--) {
      const tt = lt - m * .025, a = tt * 1.9 + j * TAU / 3;
      sats.push({ a, m, j, x: cx + Math.cos(a) * 470, y: cy + Math.sin(a) * 150 - 20 });
    }
  }
  const drawSat = s => {
    const depth = .75 + .25 * Math.sin(s.a);
    ctx.fillStyle = rgba(C.ink, (s.m === 0 ? 1 : .18 * (1 - s.m / 8)) * ui * seg(lt, .1, .4));
    miniShape(s.j, s.x, s.y, (s.m === 0 ? 15 : 9) * depth, lt * 4 + s.j);
  };
  sats.filter(s => Math.sin(s.a) < 0).forEach(drawSat);

  // hard offset shadow + shape
  if (sc > .001) {
    ctx.fillStyle = rgba(C.ink, .92 * ui); pathPts(pts, 16, 16); ctx.fill();
    ctx.fillStyle = col; pathPts(pts); ctx.fill();
    ctx.strokeStyle = rgba(C.ink, ui); ctx.lineWidth = 3; ctx.stroke();
  }
  sats.filter(s => Math.sin(s.a) >= 0).forEach(drawSat);

  // selection UI
  if (ui > 0 && sc > .05) {
    const pd = 26, bx = mnx - pd, by = mny - pd, bw = mxx - mnx + pd * 2, bh = mxy - mny + pd * 2;
    ctx.save(); ctx.globalAlpha = ui * seg(lt, .25, .45);
    ctx.strokeStyle = C.blue; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = C.paper;
    [[0, 0], [.5, 0], [1, 0], [0, .5], [1, .5], [0, 1], [.5, 1], [1, 1]].forEach(([u, v]) => {
      ctx.fillRect(bx + bw * u - 6, by + bh * v - 6, 12, 12); ctx.strokeRect(bx + bw * u - 6, by + bh * v - 6, 12, 12);
    });
    const ax = (mnx + mxx) / 2, ay = (mny + mxy) / 2;
    ctx.beginPath(); ctx.arc(ax, ay, 9, 0, TAU); ctx.moveTo(ax - 16, ay); ctx.lineTo(ax + 16, ay); ctx.moveTo(ax, ay - 16); ctx.lineTo(ax, ay + 16); ctx.stroke();
    ctx.font = `600 15px ${MONO}`; ctx.textAlign = 'left'; ctx.fillStyle = C.blue;
    const nm = p < .5 ? A.n : B.n;
    ctx.fillText(`■ shape_layer_01 — ${nm}`, bx, by - 14);
    ctx.fillStyle = C.ink;
    ctx.fillText(`ROT ${(rot * 180 / Math.PI).toFixed(1).padStart(6)}°   SCL ${(sx * sc * 100).toFixed(0).padStart(3)}/${(sy * sc * 100).toFixed(0).padStart(3)}%   Y ${yOff.toFixed(0).padStart(4)}`, bx, by + bh + 28);
    ctx.restore();
  }

  // mini timeline w/ keyframes
  if (ui > 0) {
    ctx.save(); ctx.globalAlpha = ui * seg(lt, .1, .35);
    const tx = 660, tw = 600, ty = 965;
    ctx.fillStyle = rgba(C.ink, .12); ctx.fillRect(tx, ty - 1, tw, 2);

  clap(w, v = 1) { const n = A_.nz(w, .35), bp = A_.filt('bandpass', 1500, .9), g = AC.createGain(); g.gain.setValueAtTime(.0001, w);
    [0, .011, .022].forEach(o => { g.gain.setValueAtTime(.5 * v, w + o); g.gain.exponentialRampToValueAtTime(.04, w + o + .01); });
    g.gain.setValueAtTime(.42 * v, w + .033); g.gain.exponentialRampToValueAtTime(.0001, w + .26); n.connect(bp); bp.connect(g); A_.to(g, .5); },
  hat(w, v = 1, open = 0) { const n = A_.nz(w, .3), hp = A_.filt('highpass', 7800), g = A_.env(w, .001, .16 * v, open ? .2 : .035); n.connect(hp); hp.connect(g); A_.to(g, .12); },
  bass(w, f, d = .42, v = 1) { const o = A_.osc('sawtooth', f, w, d), o2 = A_.osc('sine', f, w, d), lp = A_.filt('lowpass', 1500, 7);
    lp.frequency.setValueAtTime(1500, w); lp.frequency.exponentialRampToValueAtTime(140, w + d * .8);
    const g = A_.env(w, .005, .26 * v, d), g2 = A_.env(w, .005, .34 * v, d); o.connect(lp); lp.connect(g); o2.connect(g2); A_.to(g); A_.to(g2); },
  pluck(w, f, v = 1) { const o = A_.osc('triangle', f, w, .9), o2 = A_.osc('sine', f * 2, w, .4), g = A_.env(w, .002, .22 * v, .65), g2 = A_.env(w, .002, .07 * v, .25);
    o.connect(g); o2.connect(g2); A_.to(g, .6); A_.to(g2, .6); },
  pop(w, f, v = 1) { const o = A_.osc('sine', f * 2.2, w, .25); o.frequency.exponentialRampToValueAtTime(f, w + .05); const g = A_.env(w, .002, .32 * v, .18); o.connect(g); A_.to(g, .3); },
  blip(w, f, v = 1) { const o = A_.osc('square', f, w, .06), lp = A_.filt('lowpass', 4200), g = A_.env(w, .001, .045 * v, .035); o.connect(lp); lp.connect(g); A_.to(g, .25); },
  whoosh(w, d, v = 1, up = 1) { const n = A_.nz(w, d), bp = A_.filt('bandpass', up ? 300 : 5000, 1.3);
    bp.frequency.setValueAtTime(up ? 300 : 5000, w); bp.frequency.exponentialRampToValueAtTime(up ? 6500 : 300, w + d);
    const g = AC.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.5 * v, w + d * .85); g.gain.exponentialRampToValueAtTime(.0001, w + d);
    n.connect(bp); bp.connect(g); A_.to(g, .4); },
  riser(w, d, v = 1) { I.whoosh(w, d, v * .8);
    const o = A_.osc('sawtooth', 110, w, d), lp = A_.filt('lowpass', 300, 4); o.frequency.exponentialRampToValueAtTime(880, w + d); lp.frequency.setValueAtTime(300, w); lp.frequency.exponentialRampToValueAtTime(5000, w + d);
    const g = AC.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.1 * v, w + d); g.gain.linearRampToValueAtTime(0, w + d + .02);
    o.connect(lp); lp.connect(g); A_.to(g, .3); },
  crash(w, v = 1) { const n = A_.nz(w, 1.6), lp = A_.filt('lowpass', 12000), hp = A_.filt('highpass', 400); lp.frequency.setValueAtTime(12000, w); lp.frequency.exponentialRampToValueAtTime(2500, w + 1.4);
    const g = A_.env(w, .001, .26 * v, 1.4); n.connect(hp); hp.connect(lp); lp.connect(g); A_.to(g, .5); },
  sub(w, v = 1) { const o = A_.osc('sine', 62, w, 1); o.frequency.exponentialRampToValueAtTime(36, w + .9); const g = A_.env(w, .004, .6 * v, .9); o.connect(g); A_.to(g); },
  impact(w, v = 1) { I.sub(w, v); I.crash(w, v); },
  pad(w, fs, d, v = 1) { fs.forEach(f => [-8, 8].forEach(det => { const o = A_.osc('sawtooth', f, w, d + .5); o.detune.value = det; const lp = A_.filt('lowpass', 1700, .5);
    const g = AC.createGain(); g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.03 * v, w + .06); g.gain.setValueAtTime(.03 * v, w + d * .6); g.gain.exponentialRampToValueAtTime(.0001, w + d + .4);
    o.connect(lp); lp.connect(g); A_.to(g, .8); })); },
  glitch(w, d, v = 1) { const o = A_.osc('square', 300, w, d); for (let x = 0; x < d; x += .024) o.frequency.setValueAtTime(90 + Math.random() * 1800, w + x);
    const lp = A_.filt('lowpass', 3500), g = AC.createGain(); g.gain.setValueAtTime(.07 * v, w); g.gain.setValueAtTime(.0001, w + d); o.connect(lp); lp.connect(g); A_.to(g); },
  zap(w, v = 1) { const o = A_.osc('sine', 2400, w, .45); o.frequency.exponentialRampToValueAtTime(60, w + .4); const g = A_.env(w, .003, .22 * v, .4); o.connect(g); A_.to(g, .4); }
};
const SCORE = [];
(() => {
  const ev = (t, f, ...a) => SCORE.push({ t, f, a });
  // 1 · ignition
  ev(.03, 'pop', 520, .8); ev(.34, 'pluck', 220, .7); ev(.4, 'whoosh', .38, .55);
  [440, 523.25, 587.33, 659.25, 783.99, 880].forEach((f, i) => ev(.86 + i * .055, 'pluck', f, .75));
  for (let i = 0; i < 14; i++) ev(1.47 + i * .032, 'blip', 1100 + (hash(i) % 6) * 260, .7);
  ev(1.95, 'riser', .55, 1);
  // groove 2.5 → 13.5
  const prog = [55, 43.65, 49, 41.2, 55, 43.65];
  for (let b = 2.5; b < 13.49; b += .5) {
    const beat = Math.round((b - 2.5) / .5), bar = Math.floor(beat / 4), f = prog[bar % prog.length];
    const build = b >= 9.5 && b < 10;
    if (!build) ev(b, 'kick', 1);
    ev(b + .25, 'hat', .9);
    if (b >= 10) { ev(b + .125, 'hat', .45); ev(b + .375, 'hat', .45); }
    if (beat % 2 === 1) ev(b, 'clap', 1);
    if (!build) { ev(b, 'bass', f, .22); ev(b + .25, 'bass', f * 2, .2, .65); }
  }
  // 2 · shapes
  [660, 784, 988, 1318].forEach((f, i) => ev(3 + i * .5, 'pop', f, .9));
  ev(2.5, 'impact', .9); ev(4.62, 'whoosh', .38, .7);
  // 3 · timing
  ev(5, 'crash', .7); [220, 262, 330].forEach((f, i) => ev(5 + i * .22, 'pop', f, 1.1)); ev(5.66, 'pop', 1318, .6);
  [523, 587, 659, 784, 880, 1046].forEach((f, i) => { ev(.42 + 5 + i * .06, 'pluck', f, .35); ev(1.42 + 5 + i * .06, 'pluck', f / 2, .3); });
  ev(7.04, 'whoosh', .46, .8);
  // 4 · particles
  ev(7.5, 'impact', .8); ev(7.5, 'pad', [196, 246.94, 293.66, 369.99], .95, 1); ev(8.5, 'pad', [164.81, 196, 246.94, 293.66], .95, 1);
  for (let i = 0; i < 8; i++) ev(8.36 + i * .05, 'blip', 1500 + i * 120, .5);
  ev(8.62, 'whoosh', .5, .6); ev(9.48, 'riser', .52, 1.1);
  // 5 · 3D
  ev(10, 'impact', 1); ev(10, 'kick', 1.1); ev(11.72, 'glitch', .28, 1);
  // 6 · montage
  ev(12, 'crash', .8);
  for (let o = 0; o < 6; o++) { ev(12.01 + o * .045, 'pop', 523.25 * Math.pow(2, [0, 2, 4, 7, 9, 12][o] / 12), .55); ev(13.04 + o * .035, 'blip', 1600 - o * 160, .6); }
  ev(13.18, 'whoosh', .32, .6, 0);
  // 7 · signature
  ev(13.5, 'kick', 1.2); ev(13.5, 'impact', 1.1); ev(13.5, 'pad', [220, 261.63, 329.63, 392, 493.88], 1.15, 1.2);
  [880, 1046.5, 1174.66, 1318.5, 1567.98, 1760].forEach((f, i) => ev(13.6 + i * .045, 'pluck', f, .5));
  for (let i = 0; i < 12; i++) ev(13.88 + i * .03, 'blip', 1400 + (hash(i + 40) % 5) * 240, .55);
  ev(14.62, 'zap', 1); ev(14.9, 'pop', 520, .5);
  SCORE.sort((a, b) => a.t - b.t);
})();
let schedBase = 0, schedIdx = 0;
function startAudio(from) {
  if (!AC) audioInit();
  if (AC.state !== 'running') AC.resume();
  killBus(); newBus();
  schedBase = AC.currentTime + .04 - from;
  schedIdx = SCORE.findIndex(e => e.t >= from - .001);
  if (schedIdx < 0) { schedIdx = 0; schedBase += DUR; }
  perfBase = performance.now() / 1000 + .04 - from;
  schedule();
}
function schedule() {
  if (!bus || !AC) return;
  const horizon = AC.currentTime + .22;
  for (let guard = 0; guard < 600; guard++) {
    const e = SCORE[schedIdx], w = schedBase + e.t;
    if (w > horizon) break;
    if (w >= AC.currentTime - .03) { try { I[e.f](Math.max(w, AC.currentTime), ...e.a); } catch (err) { } }
    schedIdx++; if (schedIdx >= SCORE.length) { schedIdx = 0; schedBase += DUR; }
  }
}
setInterval(() => { if (soundOn && playing) schedule(); }, 40);

/* =====================================================================
   PLAYBACK + UI
   ===================================================================== */
const Q = new URLSearchParams(location.search);
let playing = true, soundOn = false, tHold = 0, perfBase = performance.now() / 1000;
const nowS = () => performance.now() / 1000;
function getT() {
  if (!playing) return tHold;
  let t = nowS() - perfBase;
  if (t < 0) return 0;
  if (soundOn && AC) { const at = AC.currentTime - schedBase; const d = mod(at, DUR) - mod(t, DUR); if (Math.abs(d) > .04 && Math.abs(d) < DUR / 2) perfBase -= d; t = nowS() - perfBase; }
  return mod(t, DUR);
}
function play(from = getT()) { playing = true; perfBase = nowS() - from; if (soundOn) startAudio(from); setBtn(); }
function pause() { tHold = getT(); playing = false; if (AC) killBus(); setBtn(); }
function seek(t) { t = clamp(t, 0, DUR - .001); if (playing) play(t); else tHold = t; }
const $ = id => document.getElementById(id);
const bPlay = $('bPlay'), bSnd = $('bSnd'), bar = $('bar'), fillEl = bar.querySelector('.fill'), head = bar.querySelector('.head'), timeEl = $('time'), hint = $('hint');
SCENES.forEach(s => { const m = document.createElement('div'); m.className = 'mk'; m.style.left = (s.a / DUR * 100) + '%'; m.innerHTML = `<span>${s.n}</span>`; bar.appendChild(m); });
function setBtn() { bPlay.textContent = playing ? '❚❚' : '▶'; bSnd.textContent = soundOn ? '♪ ON' : '♪ OFF'; bSnd.classList.toggle('on', soundOn); }
function enableSound(restart) {
  soundOn = true; hint.classList.add('gone');
  if (!AC) audioInit();
  AC.resume();
  if (restart) play(0); else if (playing) startAudio(getT());
  setBtn();
}
function toggleSound() { if (soundOn) { soundOn = false; if (AC) killBus(); setBtn(); } else enableSound(false); }
cvs.addEventListener('click', () => { if (!soundOn && !AC) enableSound(true); else playing ? pause() : play(); });
hint.addEventListener('click', e => { e.stopPropagation(); enableSound(true); });
bPlay.addEventListener('click', () => playing ? pause() : play());
bSnd.addEventListener('click', toggleSound);
let drag = false, wasPlaying = false;
const barT = e => { const r = bar.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * DUR; };
bar.addEventListener('pointerdown', e => { drag = true; wasPlaying = playing; pause(); tHold = barT(e); bar.setPointerCapture(e.pointerId); });
bar.addEventListener('pointermove', e => { if (drag) tHold = clamp(barT(e), 0, DUR - .001); });
bar.addEventListener('pointerup', () => { if (!drag) return; drag = false; if (wasPlaying) play(tHold); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const d = (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS); if (playing) pause(); tHold = mod(tHold + d, DUR); }
  else if (e.key === 'Home' || e.key === '0') seek(0);
  showUI();
});
let uiTimer = 0;
function showUI() { document.body.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove('ui'), 2200); }
addEventListener('pointermove', showUI);

if (Q.has('t')) { playing = false; tHold = clamp(parseFloat(Q.get('t')) || 0, 0, DUR - .001); hint.classList.add('gone'); }
setBtn();
const fmt = t => `00:${pad(Math.floor(t))}:${pad(Math.floor(t * FPS) % FPS)}`;
function frame() {
  const t = getT();
  render(t);
  const p = t / DUR * 100;
  fillEl.style.width = p + '%'; head.style.left = p + '%';
  timeEl.textContent = `${fmt(t)} / 00:15:00`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
