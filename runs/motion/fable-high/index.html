<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude — Motion Reel 2026</title>
<style>
  html,body{margin:0;height:100%;background:#050506;overflow:hidden}
  body{display:grid;place-items:center;cursor:pointer;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));background:#0c0c0e}
  #hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    font:600 11px/1 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.22em;
    text-transform:uppercase;white-space:nowrap;color:#f2ede3;background:rgba(12,12,14,.78);
    padding:11px 16px;border-radius:99px;opacity:0;transition:opacity .5s;pointer-events:none;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #hint.on{opacity:.95}
  #hint b{color:#ff4a1c;font-weight:600}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080" aria-label="Claude motion design showreel, 15 seconds"></canvas>
<div id="hint"><b>●</b>&nbsp; Click for sound &nbsp;·&nbsp; Space to pause</div>
<script>
(() => {
'use strict';

/* ───────────────────────── setup ───────────────────────── */
const W = 1920, H = 1080, DUR = 15, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const g = cv.getContext('2d', { alpha: false });
let S = 1;

const INK = '#0c0c0e', BONE = '#f2ede3', RED = '#ff4a1c', BLUE = '#2b47ff', LIME = '#d6ff3d';
const SANS = 'system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif';
const MONO = 'ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace';
const SERIF = 'Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif';
const F = (w, s, fam, it) => `${it ? 'italic ' : ''}${w} ${s}px ${fam}`;

/* ───────────────────────── math ───────────────────────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  ioExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  ioCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  ioBack: x => { const c2 = 1.70158 * 1.525; return x < .5 ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2 : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2; },
  spring: x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(11 * x),
};

/* ───────────────────────── colour ───────────────────────── */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const toA = c => typeof c === 'string' ? hex(c) : c;
const mixc = (a, b, t) => { a = toA(a); b = toA(b); t = clamp(t); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
const css = (c, al = 1) => { c = toA(c); return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`; };

/* ───────────────────────── drawing helpers ───────────────────────── */
const bg = c => { g.fillStyle = c; g.fillRect(-60, -60, W + 120, H + 120); };
const circ = (x, y, r, c) => { if (r <= 0) return; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = c; g.fill(); };
function star(cx, cy, R, r, n, rot, color) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, rr = i % 2 ? r : R, x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath(); g.fillStyle = color; g.fill();
}

const _lc = new Map();
function layout(str, font, track = 0) {
  const k = font + '|' + track + '|' + str;
  let L = _lc.get(k); if (L) return L;
  g.save(); g.font = font;
  const xs = [];
  for (let i = 0; i < str.length; i++) xs.push(g.measureText(str.slice(0, i)).width + i * track);
  const width = g.measureText(str).width + (str.length - 1) * track;
  const cap = g.measureText('H').actualBoundingBoxAscent || parseFloat(font.match(/(\d+(\.\d+)?)px/)[1]) * .72;
  g.restore();
  L = { xs, width, cap }; _lc.set(k, L); return L;
}
function fitFont(str, weight, fam, targetW, trackEm = 0, it = false, maxSize = 9999) {
  const base = 200, L = layout(str, F(weight, base, fam, it), trackEm * base);
  const size = Math.min(maxSize, Math.floor(base * targetW / L.width));
  return { size, font: F(weight, size, fam, it), track: trackEm * size };
}
const alignX = (x, w, align) => align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
function text(str, x, y, font, color, align = 'left', track = 0) {
  const L = layout(str, font, track), x0 = alignX(x, L.width, align);
  g.font = font; g.fillStyle = color; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  if (!track) g.fillText(str, x0, y); else for (let i = 0; i < str.length; i++) g.fillText(str[i], x0 + L.xs[i], y);
  return L;
}
// mono label with type-on + cursor
// (fixed-pitch grid, so live-updating strings never touch the layout cache)
const _adv = new Map();
function monoAdv(font) {
  let a = _adv.get(font);
  if (a === undefined) { g.save(); g.font = font; a = g.measureText('0000000000').width / 10; g.restore(); _adv.set(font, a); }
  return a;
}
function label(str, x, y, p, color, align = 'left', size = 20, track = 4, weight = 600) {
  const font = F(weight, size, MONO), adv = monoAdv(font) + track, L = { width: str.length * adv - track };
  const x0 = alignX(x, L.width, align);
  p = clamp(p); const n = Math.round(str.length * p); if (p <= 0) return L;
  g.font = font; g.fillStyle = color; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  for (let i = 0; i < n; i++) if (str[i] !== ' ') g.fillText(str[i], x0 + i * adv, y);
  if (p < 1) g.fillRect(x0 + n * adv + 2, y - size * .8, size * .5, size * .95);
  return L;
}
// letters rise through a baseline mask, staggered
function riseWord(str, x, base, font, color, t, t0, o = {}) {
  const { stag = .03, dur = .35, align = 'left', track = 0, desc = .06, ease = E.outExpo, out = 0 } = o;
  const L = layout(str, font, track), x0 = alignX(x, L.width, align);
  g.save();
  g.beginPath(); g.rect(x0 - 60, base - L.cap * 1.45, L.width + 120, L.cap * (1.45 + desc)); g.clip();
  g.font = font; g.fillStyle = color; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  for (let i = 0; i < str.length; i++) {
    const e = ease(prog(t, t0 + i * stag, t0 + i * stag + dur)); if (e <= 0) continue;
    g.fillText(str[i], x0 + L.xs[i], base + (1 - e) * L.cap * (1.4 + desc) + out * L.cap * (1.5 + desc));
  }
  g.restore();
  return L;
}
function ringText(str, cx, cy, r, font, color, rot) {
  g.save(); g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  const n = str.length;
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    g.save(); g.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); g.rotate(a + Math.PI / 2); g.fillText(str[i], 0, 0); g.restore();
  }
  g.restore(); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
}

/* ───────────────────────── precomputed assets ───────────────────────── */
const FT = {
  title: fitFont('CLAUDE', 900, SANS, 1180, -.012),
  type: fitFont('TYPE', 900, SANS, 1380, -.01),
  that: fitFont('that', 400, SERIF, 980, 0, true),
  moves: fitFont('MOVES', 900, SANS, 1330, -.01),
  shape: fitFont('SHAPE', 900, SANS, 800, -.01, false, 196),
  rhythm: fitFont('RHYTHM', 900, SANS, 840, -.01, false, 196),
  end: fitFont('LET’S MAKE', 900, SANS, 1130, -.018),
};

// scene 3 — tiles
const TILE = 240, TCOLS = 8, TROWS = 5, TY0 = -60;
const TPAL = [[BONE, INK], [BONE, RED], [BONE, BLUE], [INK, BONE], [INK, LIME], [RED, BONE], [BLUE, LIME], [LIME, INK], [BONE, INK], [BONE, RED], [BLUE, BONE], [RED, INK], [INK, RED], [BONE, BLUE]];
const TILES = [];
for (let j = 0; j < TROWS; j++) for (let i = 0; i < TCOLS; i++) {
  const s = i * 13 + j * 71 + 5, pal = TPAL[Math.floor(rnd(s) * TPAL.length)];
  TILES.push({
    i, j, type: Math.floor(rnd(s + 9) * 7), bgc: pal[0], fg: pal[1], rot: Math.floor(rnd(s + 3) * 4) * Math.PI / 2,
    dist: Math.hypot(i - 3.5, j - 2), block: j === 2 && i >= 2 && i <= 5,
  });
}
// scene 3 — morph shapes
const MN = 180;
function resample(verts, N) {
  const n = verts.length, lens = []; let total = 0;
  for (let i = 0; i < n; i++) { const a = verts[i], b = verts[(i + 1) % n], l = Math.hypot(b[0] - a[0], b[1] - a[1]); lens.push(l); total += l; }
  const out = new Float32Array(N * 2); let si = 0, acc = 0;
  for (let k = 0; k < N; k++) {
    const d = k / N * total;
    while (si < n - 1 && acc + lens[si] < d) { acc += lens[si]; si++; }
    const f = (d - acc) / lens[si], a = verts[si], b = verts[(si + 1) % n];
    out[k * 2] = a[0] + (b[0] - a[0]) * f; out[k * 2 + 1] = a[1] + (b[1] - a[1]) * f;
  }
  return out;
}
const ngon = (n, R, r = R) => Array.from({ length: n }, (_, k) => { const a = -Math.PI / 2 + k / n * TAU, rr = k % 2 ? r : R; return [Math.cos(a) * rr, Math.sin(a) * rr]; });
const SH = [
  resample(ngon(90, 215), MN),
  resample([[0, -188], [188, -188], [188, 188], [-188, 188], [-188, -188]], MN),
  resample(ngon(3, 262).map(p => [p[0], p[1] + 30]), MN),
  resample(ngon(10, 270, 118), MN),
];
const SHNAME = ['CIRCLE', 'SQUARE', 'TRIANGLE', 'STAR'];

// scene 4 — point cloud
const PU = 48, PV = 27, PN = PU * PV;
const PA = new Float32Array(PN * 3), PB = new Float32Array(PN * 3), PR = new Float32Array(PN);
const psx = new Float32Array(PN), psy = new Float32Array(PN), psr = new Float32Array(PN), psa = new Float32Array(PN), psf = new Float32Array(PN);
for (let i = 0; i < PN; i++) {
  const u = i % PU, v = (i / PU) | 0, th = u / PU * TAU, ph = (v + .5) / PV * Math.PI, tv = v / PV * TAU;
  PA[i * 3] = 290 * Math.sin(ph) * Math.cos(th); PA[i * 3 + 1] = -290 * Math.cos(ph); PA[i * 3 + 2] = 290 * Math.sin(ph) * Math.sin(th);
  const R = 255 + 118 * Math.cos(tv);
  PB[i * 3] = R * Math.cos(th); PB[i * 3 + 1] = 118 * Math.sin(tv); PB[i * 3 + 2] = R * Math.sin(th);
  PR[i] = rnd(i + 2000);
}

// scene 5 — easing presets
const EZ = [[.25, .25, .75, .75], [.16, 1, .3, 1], [.76, 0, .24, 1], [.34, 1.56, .64, 1]];
const EZNAME = ['LINEAR', 'EXPO OUT', 'QUART IN-OUT', 'BACK OUT'];
const bez = (p, s) => { const u = 1 - s; return [3 * u * u * s * p[0] + 3 * u * s * s * p[2] + s * s * s, 3 * u * u * s * p[1] + 3 * u * s * s * p[3] + s * s * s]; };
function bezY(p, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  let lo = 0, hi = 1;
  for (let i = 0; i < 18; i++) { const m = (lo + hi) / 2; if (bez(p, m)[0] < x) lo = m; else hi = m; }
  return bez(p, (lo + hi) / 2)[1];
}

// scene 6 — confetti
const CONF = Array.from({ length: 64 }, (_, i) => ({
  ang: rnd(i + 50) * TAU, sp: 520 + rnd(i + 80) * 1350, rot: rnd(i + 11) * TAU, spin: (rnd(i + 31) - .5) * 16,
  size: 12 + rnd(i + 70) * 20, type: i % 6, col: [INK, RED, BLUE, RED, INK, LIME, BLUE][i % 7],
}));

/* ───────────────────────── SCENE 1 — title ───────────────────────── */
function scene1(t) {
  bg(INK);
  const cx = 960, cy = 540, f = FT.title, L = layout('CLAUDE', f.font, f.track);
  const dotR = f.size * .083, gap = f.size * .045, total = L.width + gap + dotR * 2;
  const x0 = cx - total / 2, base = cy + L.cap / 2, band = L.cap / 2 + 72;
  const push = 1 + .05 * E.outCubic(prog(t, .8, 2.5));

  g.save(); g.translate(cx, cy); g.scale(push, push); g.translate(-cx, -cy);
  if (t < .8) {
    // the dot — breathes, then draws itself out into a line
    const pulse = Math.sin(Math.PI * prog(t, 0, .26)), pl = E.ioExpo(prog(t, .24, .8));
    const w = lerp(28, 1500, pl), h = lerp(28, 4, pl) * (1 + .7 * pulse * (1 - pl)), r = h / 2;
    const ww = Math.max(w * (1 + .7 * pulse * (1 - pl)), h);
    g.fillStyle = RED; g.beginPath();
    g.moveTo(cx - ww / 2 + r, cy - r); g.lineTo(cx + ww / 2 - r, cy - r); g.arc(cx + ww / 2 - r, cy, r, -Math.PI / 2, Math.PI / 2);
    g.lineTo(cx - ww / 2 + r, cy + r); g.arc(cx - ww / 2 + r, cy, r, Math.PI / 2, Math.PI * 1.5); g.fill();
  } else {
    const po = E.outExpo(prog(t, .8, 1.3));
    g.fillStyle = RED; g.fillRect(cx - 750, cy - band * po - 2, 1500, 4); g.fillRect(cx - 750, cy + band * po - 2, 1500, 4);
    g.save(); g.beginPath(); g.rect(0, cy - band * po, W, 2 * band * po); g.clip();
    g.font = f.font; g.fillStyle = BONE; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    for (let i = 0; i < 6; i++) {
      const e = E.outExpo(prog(t, .78 + i * .03, 1.14 + i * .03));
      g.fillText('CLAUDE'[i], x0 + L.xs[i], base + (1 - e) * (L.cap + 90));
    }
    g.restore();
    circ(x0 + L.width + gap + dotR, base - dotR, dotR * E.outBack(prog(t, 1.04, 1.36)), RED);

    label('MOTION DESIGN REEL', cx - 750, cy - band - 22, prog(t, 1.05, 1.45), BONE);
    label('VOL.01 — 2026', cx + 750, cy - band - 22, prog(t, 1.15, 1.5), BONE, 'right');
    label('TYPE / SHAPE / DEPTH / TIMING', cx - 750, cy + band + 42, prog(t, 1.25, 1.75), BONE);

    // serif counterpoint
    const sf = F(400, 196, SERIF, true), SL = layout('showreel', sf), sp = E.ioCubic(prog(t, 1.3, 1.78));
    if (sp > 0) {
      g.save(); g.translate(cx + 372, cy + band + 4); g.rotate(-.095);
      g.beginPath(); g.rect(-SL.width / 2 - 30, -230, (SL.width + 80) * sp, 330); g.clip();
      g.font = sf; g.fillStyle = RED; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillText('showreel', -SL.width / 2, 40);
      g.restore();
    }
  }
  g.restore();

  // wipe out
  const e = E.ioCubic(prog(t, 2.12, 2.5));
  if (e > 0) {
    const edge = e * (W + 260) - 130;
    g.fillStyle = BLUE; g.fillRect(edge + 60, -60, 70, H + 120);
    g.fillStyle = LIME; g.fillRect(edge, -60, 60, H + 120);
    g.fillStyle = RED; g.fillRect(-60, -60, edge + 60, H + 120);
  }
}

/* ───────────────────────── SCENE 2 — kinetic type ───────────────────────── */
function scene2(t) {
  if (t < 3) {                                                     // TYPE
    bg(RED);
    const f = FT.type, L = layout('TYPE', f.font, f.track), base = 540 + L.cap / 2 - 14, s = 1 + .05 * prog(t, 2.5, 3);
    g.save(); g.translate(960, 540); g.scale(s, s); g.translate(-960, -540);
    riseWord('TYPE', 960, base, f.font, INK, t, 2.5, { stag: .035, dur: .3, align: 'center', track: f.track });
    g.fillStyle = INK; g.fillRect(960 - L.width / 2, base + 46, L.width * E.outExpo(prog(t, 2.56, 2.95)), 16);
    label('KINETIC TYPOGRAPHY', 960 - L.width / 2, base - L.cap - 36, prog(t, 2.56, 2.85), INK);
    label('01 / 03', 960 + L.width / 2, base - L.cap - 36, prog(t, 2.6, 2.85), INK, 'right');
    g.restore();
  } else if (t < 3.5) {                                            // that
    bg(BONE);
    const f = FT.that, L = layout('that', f.font), base = 540 + L.cap / 2 + 6, x0 = 960 - L.width / 2 - 20, n = 11, top = 60, sh = (H - 120) / n;
    g.font = f.font; g.fillStyle = BLUE; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    for (let i = 0; i < n; i++) {
      const e = E.outExpo(prog(t, 3 + i * .012, 3.3 + i * .012)), dx = (i % 2 ? 1 : -1) * (1 - e) * 900;
      g.save(); g.beginPath(); g.rect(-60, top + i * sh, W + 120, sh + .6); g.clip();
      g.fillText('that', x0 + dx + (t - 3) * 30, base);
      g.restore();
    }
    label('02 / 03', 1650, 240, prog(t, 3.08, 3.3), BLUE, 'right');
    g.fillStyle = BLUE; g.fillRect(270, 880, 1380 * E.outExpo(prog(t, 3.06, 3.45)), 3);
    label('(ADV.)  USED TO INTRODUCE WHAT HAPPENS NEXT', 270, 922, prog(t, 3.1, 3.42), BLUE, 'left', 18, 3);
  } else if (t < 4) {                                              // MOVES
    bg(BLUE);
    const f = FT.moves, L = layout('MOVES', f.font, f.track), base = 540 + L.cap / 2 + 128;
    const slide = (1 - E.outBack(prog(t, 3.5, 3.82))) * 1500, spread = 47 * E.outExpo(prog(t, 3.54, 3.98));
    g.save(); g.translate(960, 540); g.transform(1, 0, -.22, 1, 0, 0); g.translate(-960, -540);
    g.font = f.font; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round'; g.lineWidth = 4; g.strokeStyle = LIME; g.fillStyle = LIME;
    const x0 = 960 - L.width / 2 + slide + 20;
    for (let k = 6; k >= 0; k--) {
      const tt = t - k * .032;
      g.globalAlpha = k ? 1 - k * .13 : 1;
      for (let i = 0; i < 5; i++) {
        const y = base - k * spread + Math.sin((tt - 3.5) * 17 - i * .95) * 15, x = x0 + L.xs[i] + k * spread * .1;
        k ? g.strokeText('MOVES'[i], x, y) : g.fillText('MOVES'[i], x, y);
      }
    }
    g.globalAlpha = 1; g.restore();
    label('03 / 03', 1650, 180, prog(t, 3.58, 3.8), LIME, 'right');
  } else {                                                         // marquee wall + badge
    bg(INK);
    const font = F(900, 150, SANS), str = 'MOTION — DESIGN — RHYTHM — TIMING — ', L = layout(str, font), rows = 9, rh = 166;
    const kick = E.outExpo(prog(t, 4.5, 4.85)) * 150;
    g.save(); g.translate(960, 540); g.rotate(-.14);
    g.font = font; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round'; g.lineWidth = 2.5;
    for (let r = 0; r < rows; r++) {
      const dir = r % 2 ? 1 : -1, speed = 250 + (r * 53 % 150);
      let off = (((t - 4) * speed + kick) * dir + r * 317) % L.width; if (off < 0) off += L.width;
      const e = E.outExpo(prog(t, 4 + r * .022, 4.3 + r * .022));
      g.save(); g.translate(0, (r - (rows - 1) / 2) * rh); g.scale(1, e);
      const filled = r % 2 === 0, col = r === 2 ? RED : r === 6 ? LIME : BONE;
      g.fillStyle = col; g.strokeStyle = col;
      for (let x = -1250 - L.width + off; x < 1250; x += L.width) filled ? g.fillText(str, x, L.cap / 2) : g.strokeText(str, x, L.cap / 2);
      g.restore();
    }
    g.restore();
    // badge → iris
    const pop = E.outBack(prog(t, 4.5, 4.85)), grow = E.inCubic(prog(t, 4.7, 5));
    if (pop > 0) {
      const R = 218 * pop + grow * 1150, a = 1 - prog(t, 4.7, 4.88);
      circ(960, 540, R, BONE);
      if (a > 0) {
        g.save(); g.globalAlpha = a; g.translate(960, 540); g.scale(pop * (1 + grow * 2), pop * (1 + grow * 2));
        ringText('CLAUDE · MOTION REEL · TWENTY TWENTY-SIX · ', 0, 0, 172, F(700, 23, MONO), INK, (t - 4.5) * 1.6);
        star(0, 0, 112, 62, 12, -(t - 4.5) * 2.2, RED);
        circ(0, 0, 20, BONE);
        g.restore();
      }
    }
  }
}

/* ───────────────────────── SCENE 3 — shape + rhythm ───────────────────────── */
function drawTile(type, c, fg, bgc) {

/* ───────────────────────── HUD ───────────────────────── */
const SCN = [[0, 'TITLE'], [2.5, 'KINETIC TYPE'], [5, 'SHAPE + RHYTHM'], [7.5, 'DEPTH'], [10, 'TIMING'], [12, 'SIGN-OFF']];

/* ───────────────────────── post ───────────────────────── */
const IMP = [[1, 1], [2.5, .7], [3, .65], [3.5, .65], [4, .7], [4.5, .4], [5, .6], [6, .35], [7.5, .9], [10, .35], [12, 1.25]];

const ga = bufA.getContext('2d'), gb = bufB.getContext('2d');

{
  const gg = grain.getContext('2d'), id = gg.createImageData(256, 256);

}
let grainPat = null;
function post(t, split) {

/* ───────────────────────── frame ───────────────────────── */
function frame(t) {

/* ───────────────────────── audio (synthesised, optional) ───────────────────────── */
let ac = null, master, send, noiseBuf, aT0 = 0, loopsScheduled = 0, muted = false;

  send.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(master);

function noise(t, dur, ftype, f0, f1, q, peak, att = .004) {

const kick = (t, v = .85) => { tone(t, 'sine', 170, 43, .34, v, .002); noise(t, .02, 'highpass', 3000, 3000, .7, v * .25, .001); };
const hat = (t, v = .15) => noise(t, .045, 'highpass', 8500, 8500, .7, v, .001);

const swish = (t, dur = .2, v = .16) => noise(t, dur, 'bandpass', 5000, 500, 1.1, v, .01);

const impact = (t, v = 1) => { kick(t, Math.min(1, v)); tone(t, 'sine', 62, 34, 1.1, .55 * v, .004); noise(t, .9, 'lowpass', 5200, 180, .7, .32 * v, .002); };
function score(T) {

  riser(at(.25), .75, .3); impact(at(1), 1); padChord(at(1), [45, 52, 57, 60, 64], 1.3, .07);
  [1.5, 1.75, 2, 2.125, 2.25, 2.375].forEach((x, i) => hat(at(x), .08 + i * .03));
  riser(at(2.05), .45, .26);

/* ───────────────────────── transport ───────────────────────── */
const hint = document.getElementById('hint');
const qs = new URLSearchParams(location.search);

let t0 = performance.now(), paused = false, pausedAt = 0, hintTimer = 0;

  if (paused) return pausedAt;

}

}

}

  else { paused = false; t0 = performance.now() - pausedAt * 1000; if (ac) ac.resume(); showHint('Playing', 900); }

addEventListener('click', toggleSound);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'm' || e.key === 'M') toggleSound();

setInterval(pump, 250);

addEventListener('resize', resize);
resize();

function loop() {
  let t = clock(); if (t < 0) t = 0;
  frame(t % DUR);
  requestAnimationFrame(loop);
}
if (frozen !== null) { frame(frozen); }

})();
